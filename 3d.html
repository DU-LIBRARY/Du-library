<style>
/* Layout: the library room as a large 3D stage, view buttons on the stage, a case strip under it, then a find box and the selected-book card. Same tokens as the Shelf Map. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #17221e; --muted: #5a6762; --faint: #8a9690; --line: #dde3df;
  --accent: #0e5a48; --accent-soft: #e2efea; --accent-ink: #ffffff; --gilt: #a7762a; --gilt-soft: #f6eddc;
  --scene: #e7e3da; --floor: #c9bfae; --wall: #efeae0; --wood: #6e533c; --wood-dark: #4f3a29; --mark: #fbe7a8;
  --f-title: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgb(16 40 32 / 6%), 0 4px 16px rgb(16 40 32 / 5%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
  --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519;
  --scene: #121a17; --floor: #2a2620; --wall: #1d2421; --wood: #5a4331; --wood-dark: #3a2b1f; --mark: #5a4a17;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
  --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519;
  --scene: #121a17; --floor: #2a2620; --wall: #1d2421; --wood: #5a4331; --wood-dark: #3a2b1f; --mark: #5a4a17;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 20px 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: end; justify-content: space-between; }
.brand h1 { font-family: var(--f-title); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.brand .sub { font-family: var(--f-title); color: var(--gilt); font-size: 1.1rem; margin: 0 0 2px; }
.stats { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.stats b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; border: 1px solid var(--line); background: var(--surface); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--gilt); display: inline-block; }

.stage { position: relative; height: min(70vh, 680px); min-height: 360px; border-radius: 12px; overflow: hidden; background: var(--scene); box-shadow: var(--shadow); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.views { position: absolute; inset-inline-start: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
.views button { border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.82rem; }
.views button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.hint { position: absolute; inset-inline-end: 10px; bottom: 10px; font-size: 0.75rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 3px 10px; border-radius: 999px; pointer-events: none; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.9rem; }
.loading[hidden] { display: none; }
.compass { position: absolute; inset-inline-start: 10px; bottom: 10px; font-size: 0.75rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 3px 10px; border-radius: 999px; pointer-events: none; }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px 4px; scrollbar-width: thin; }
.ct { flex: none; min-width: 52px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; text-align: start; display: grid; gap: 3px; }
.ct[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.ct .cl { font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ct .cl small { font-weight: 500; color: var(--faint); font-size: 0.7rem; font-variant-numeric: tabular-nums; }
.ct .sw { display: flex; height: 5px; border-radius: 2px; overflow: hidden; background: var(--line); }
.ct .sw b { display: block; height: 100%; }
.levels { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-block: 6px 0; font-size: 0.82rem; color: var(--muted); }
.levels button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
.levels button:hover { border-color: var(--accent); }
.levels button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.ct .tt { font-size: 0.66rem; color: var(--gilt); font-weight: 600; }
.ct.wall { background: transparent; border-style: dashed; color: var(--muted); cursor: default; font-size: 0.75rem; place-content: center; }

.below { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; padding-block: 12px 48px; align-items: start; }
@media (max-width: 820px) { .below { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
.find { padding: 14px; display: grid; gap: 10px; }
.find input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--bg); unicode-bidi: plaintext; }
.find input:focus { border-color: var(--accent); outline: none; }
.results { display: grid; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; padding: 8px 4px; border: 0; border-top: 1px solid var(--line); background: none; text-align: start; cursor: pointer; width: 100%; }
.res:hover { background: var(--accent-soft); }
.res .rt { font-family: var(--f-title); font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.res .ra { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; font-family: var(--f-ar); }
.res .rl { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 600; color: var(--accent); font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.none { color: var(--muted); font-size: 0.85rem; padding: 4px; }

.card { padding: 16px; display: grid; gap: 10px; }
.card .t { font-family: var(--f-title); font-weight: 700; font-size: 1.4rem; line-height: 1.35; margin: 0; overflow-wrap: anywhere; text-wrap: balance; }
.card .a { font-family: var(--f-ar); color: var(--muted); overflow-wrap: anywhere; margin: 0; }
.loc { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.loc div { background: var(--bg); border-radius: 8px; padding: 8px 10px; display: grid; gap: 0; }
.loc span { font-size: 0.7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.loc b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 0.75rem; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; display: inline-flex; gap: 6px; align-items: center; }
.chip.go { cursor: pointer; background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--muted); padding: 0 14px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .ar { font-family: var(--f-ar); }
.notes { color: var(--muted); font-size: 0.82rem; margin: 0; max-width: 70ch; }
@media (max-width: 520px) { .stage { height: 62vh; } .loc b { font-size: 1rem; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><p class="sub" lang="ar" dir="rtl">المكتبة بالأبعاد الثلاثة</p><h1>Darul Uloom Library 3D</h1></div>
    <div class="stats" id="stats"></div>

  <div class="stage" id="stage">

      <button type="button" data-view="above" aria-pressed="false">From above</button>
      <button type="button" data-view="left" aria-pressed="false">Left wall</button>

    </div>
    <div class="compass" id="compass">Door behind you · Case A on your left</div>
    <div class="hint" id="hint">Drag to look · pinch or scroll to zoom · tap a book</div>
  </div>

  <div class="strip" id="strip" aria-label="Go to a case"></div>
  <div class="levels" id="levels" hidden></div>

  <div class="below">
    <section class="panel" aria-labelledby="sel-h">
      <div class="card" id="card"></div>
    </section>
    <section class="panel">
      <div class="find">
        <h2 id="find-h">Find a book</h2>
        <input id="q" type="search" dir="auto" placeholder="ابحث بالعنوان أو المؤلف · Title or author" aria-labelledby="find-h" autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <div class="legend" id="legend"></div>
    </section>
  </div>
  <p class="notes" id="notes"></p>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const D = JSON.parse($('#data').textContent);
const BOOKS = D.books, CATS = D.cats;
// Same genre colours as the Shelf Map
const GC = ['#2f6b4f', '#4d8a62', '#7aa36b', '#2c5a8a', '#3f74a8', '#5f8fbf', '#8a2f2f', '#a8473d', '#c0675b', '#5b4a8a',
            '#a0702a', '#b88a3a', '#2f7a7a', '#4f9a94', '#4a5568', '#647187', '#7c879a', '#94a0b0', '#8a7a5a', '#a08a60', '#6b6b6b', '#808080'];
const genreColor = k => GC[k % GC.length];

// ---------- room dimensions (metres) ----------
const PER_SIDE = 16, LEVELS = 6, CAP = 75;
const W = 1.15, H = 2.15, DEP = 0.32, SIDE_T = 0.025, PLINTH = 0.08, PLANK = 0.02, TOP_T = 0.04;
const PITCH_Y = (H - PLINTH - TOP_T) / LEVELS;
const GAP = 0.02, PITCH_Z = W + GAP, START_Z = 1.0;
const ROOM_W = 4.0, ROOM_L = START_Z + PER_SIDE * PITCH_Z + 1.2, WALL_H = 2.9;
const IW = W - 2 * SIDE_T, TB = IW / CAP;

// Case letters fill positions in order: left wall from the door, then the right wall from the door.
const POS = [];
for (let i = 0; i < PER_SIDE * 2; i++) {
  const left = i < PER_SIDE, j = i % PER_SIDE;
  const z = -(START_Z + j * PITCH_Z + W / 2);
  POS.push({ i, left, j, z, x: left ? -ROOM_W / 2 + DEP / 2 : ROOM_W / 2 - DEP / 2, rot: left ? Math.PI / 2 : -Math.PI / 2, caseId: D.cases[i] || null });
}
const POS_OF = new Map(POS.filter(p => p.caseId).map(p => [p.caseId, p]));

}
// Lay each level out from its right-hand end.

  const vols = list.reduce((n, r) => n + r.n, 0);
  if (vols > CAP) for (const r of list) r.vw = r.vw.map(w => w * CAP / vols);
  let x = 0;
  for (const r of list) { r.vx = []; r.vw.forEach(w => { r.vx.push(x + w / 2); x += w; }); r.x0 = r.vx[0] - r.vw[0] / 2; r.x1 = x; }
}
// Volume numbers on each spine (volume 1 on the right).
{ const seen = new Map(), parts = new Map();
  for (const r of runs) { parts.set(r.b, (parts.get(r.b) || 0) + 1); const s = seen.get(r.b) || 0; r.vol0 = s + 1; seen.set(r.b, s + r.n); }

  for (const r of runs) r.numbered = parts.get(r.b) === 1; }
function localMatrix(r, m, pull) {

  const hh = r.vh[m];
  const dd = 0.2 + hash(r.b + 'd') * 0.05;
  return { x: IW / 2 - r.vx[m], y: shelfBase + hh / 2, z: DEP / 2 - 0.02 - dd / 2 + (pull || 0), h: hh, d: dd, w: r.vw[m] };
}

  const sp = spinesByRun.get(r.ri);
  for (let m = 0; m < r.n; m++) {
    const L = localMatrix(r, m, pull);
    tmp.position.set(L.x, L.y, L.z); tmp.rotation.set(0, 0, 0); tmp.scale.set(L.w * FILL, L.h, L.d); tmp.updateMatrix();

}
function setCanvas(r, title, base) {
  // one canvas for the whole set; each volume shows its own slice
  const n = r.n, pw = 48, ph = Math.min(1200, Math.round(pw * r.vh[0] / (r.vw[0] * FILL)));
  const c = document.createElement('canvas'); c.width = n * pw; c.height = ph;
