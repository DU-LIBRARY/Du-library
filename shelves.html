<style>
@font-face { font-family: "Amiri"; font-weight: 400; font-display: swap; src: url(fonts/amiri-400.woff) format("woff"); }
@font-face { font-family: "Amiri"; font-weight: 700; font-display: swap; src: url(fonts/amiri-700.woff) format("woff"); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; font-display: swap; src: url(fonts/plexarabic-400.woff) format("woff"); }
@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 500; font-display: swap; src: url(fonts/plexarabic-500.woff) format("woff"); }

<style>
:root { --tabh: 58px; }
body { background: var(--bg); color: var(--ink); padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px)); }
.apptabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; gap: 4px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--surface, #fff) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line, #dde3df); }
.apptabs a { flex: 0 1 150px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 6px; border-radius: 10px;
  text-decoration: none; color: var(--muted, #5a6762); font: 500 0.72rem/1.2 "IBM Plex Sans", system-ui, -apple-system, sans-serif; }
.apptabs a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.apptabs a[aria-current="page"] { color: var(--accent, #0e5a48); background: color-mix(in srgb, var(--accent, #0e5a48) 12%, transparent); }
.apptabs a:focus-visible { outline: 2px solid var(--accent, #0e5a48); outline-offset: 1px; }
.offline-note { display: block; margin-top: 6px; }
.offline-note i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint, #8a9690); margin-right: 6px; vertical-align: 1px; }
.offline-note.ok i { background: var(--accent, #0e5a48); }
.actions { bottom: 0; } .toast { bottom: calc(var(--tabh) + 16px + env(safe-area-inset-bottom, 0px)) !important; }
</style>

<body>
<style>
/* Layout: a strip of bookcases (the room), the chosen case drawn as five shelves, and a shelf panel for moving books. */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --ink: #17221e; --muted: #5a6762; --faint: #8a9690; --line: #dde3df;
  --accent: #0e5a48; --accent-soft: #e2efea; --accent-ink: #ffffff; --gilt: #a7762a; --gilt-soft: #f6eddc;
  --frame: #5b4634; --plank: #8a6a4c; --cavity: #efe9df; --warn: #b7791f; --bad: #b42318; --bad-soft: #fde8e6; --mark: #fbe7a8;
  --f-title: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
  --r: 10px; --shadow: 0 1px 2px rgb(16 40 32 / 6%), 0 4px 16px rgb(16 40 32 / 5%);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
  --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519;
  --frame: #3a2c21; --plank: #6b5039; --cavity: #1b1713; --warn: #e0a347; --bad: #f2786b; --bad-soft: #3a1c19; --mark: #5a4a17;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
  --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519;
  --frame: #3a2c21; --plank: #6b5039; --cavity: #1b1713; --warn: #e0a347; --bad: #f2786b; --bad-soft: #3a1c19; --mark: #5a4a17;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: 16px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ar { font-family: var(--f-ar); }

header.top { padding-block: 20px 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: end; justify-content: space-between; }
.brand h1 { font-family: var(--f-title); font-weight: 700; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.1; margin: 0; }
.brand .sub { font-family: var(--f-title); color: var(--gilt); font-size: 1.1rem; margin: 0 0 2px; }
.stats { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.stats b { color: var(--ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 0.78rem; border: 1px solid var(--line); background: var(--surface); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.pill.live i { background: #2f9e6e; } .pill.ro i { background: var(--warn); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding-block: 8px 10px; border-bottom: 1px solid var(--line); }
.barrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.find { position: relative; flex: 1 1 260px; min-width: 0; }
.find input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); unicode-bidi: plaintext; }
.find input:focus { border-color: var(--accent); outline: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; color: var(--ink); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.results { position: absolute; inset-inline: 0; top: calc(100% + 4px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 60vh; overflow: auto; z-index: 10; }
.res { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; width: 100%; text-align: start; cursor: pointer; }
.res:hover { background: var(--accent-soft); }
.res .rt { font-family: var(--f-title); font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; min-width: 0; }
.res .ra { color: var(--muted); font-size: 0.82rem; grid-column: 1; overflow-wrap: anywhere; }
.res .rl { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-weight: 600; color: var(--accent); font-size: 0.85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }

.strip { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px 6px; scrollbar-width: thin; }
.ctile { flex: none; width: 92px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 7px 7px; cursor: pointer; text-align: start; display: grid; gap: 3px; }
.ctile[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
.ctile .cl { font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: baseline; }
.ctile .cl small { font-weight: 500; color: var(--faint); font-size: 0.7rem; font-variant-numeric: tabular-nums; }
.ctile .cg { font-family: var(--f-ar); font-size: 0.74rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: right; }
.mini { display: grid; gap: 2px; }
.mini span { display: block; height: 5px; border-radius: 2px; background: var(--line); overflow: hidden; }
.mini span b { display: block; height: 100%; }
.ctile.tray { background: var(--gilt-soft); border-color: transparent; }
.ctile.addc { place-content: center; text-align: center; color: var(--accent); font-weight: 600; border-style: dashed; }

.work { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 18px; padding-block: 8px 60px; align-items: start; }
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); } }

.case { background: var(--frame); border-radius: 10px; padding: 10px 10px 4px; box-shadow: var(--shadow); }
.casehead { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #f3e9dc; padding: 2px 4px 8px; flex-wrap: wrap; }
.casehead h2 { margin: 0; font-size: 1.05rem; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.casehead h2 input { background: transparent; border: 0; border-bottom: 1px dashed rgb(243 233 220 / 40%); color: inherit; font-weight: 600; width: 12ch; padding: 0 2px; }
.casehead .tools { display: flex; gap: 6px; }
.casehead .btn { background: rgb(255 255 255 / 10%); border-color: rgb(255 255 255 / 20%); color: #f3e9dc; }
.level { display: block; width: 100%; border: 0; padding: 0; margin: 0 0 6px; background: none; cursor: pointer; text-align: start; color: inherit; border-radius: 4px; }
.lvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: #f3e9dc; font-size: 0.78rem; padding: 0 2px 3px; }
.lvhead .code { font-weight: 700; font-variant-numeric: tabular-nums; }
.lvhead .lab { font-family: var(--f-ar); opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; text-align: center; }
.lvhead .fill { font-variant-numeric: tabular-nums; opacity: .9; }
.lvhead .fill.warn { color: #ffd38a; } .lvhead .fill.bad { color: #ffb4a8; font-weight: 700; }
.cavity { background: var(--cavity); height: 74px; border-radius: 3px 3px 0 0; display: flex; align-items: flex-end; gap: 1px; padding: 6px 4px 0; overflow: hidden; }
.cavity.rtl { direction: rtl; }
.cavity.titled { height: 150px; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
.cavity.titled .spine { flex: var(--n) 0 calc(var(--n) * 14px); }
.plank { height: 7px; background: var(--plank); border-radius: 0 0 3px 3px; }
.level[aria-pressed="true"] .cavity { box-shadow: inset 0 0 0 2px var(--accent); }
.level.over .plank { background: var(--bad); }
.spine { flex: var(--n) 0 0; min-width: 2px; border-radius: 2px 2px 0 0; position: relative; overflow: hidden; container-type: inline-size; display: flex; justify-content: center; }
.spine .st { writing-mode: vertical-rl; font-family: var(--f-ar); font-size: 11px; line-height: 1.15; color: #fff; text-shadow: 0 0 2px rgb(0 0 0 / 55%);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: calc(100% - 16px); padding-top: 5px; direction: rtl; unicode-bidi: plaintext; }
.spine .sv { position: absolute; bottom: 2px; inset-inline: 0; text-align: center; font-size: 9px; color: #fff; opacity: .85; font-variant-numeric: tabular-nums; }
@container (max-width: 11px) { .spine .st, .spine .sv { display: none; } }
.spine:nth-child(even) { filter: brightness(1.18) saturate(.9); }
.spine.hit { outline: 2px solid var(--gilt); outline-offset: 1px; animation: pulse 1.2s ease-in-out 3; z-index: 1; }
@keyframes pulse { 50% { outline-color: transparent; } }
.cavity .empty { color: var(--faint); font-size: 0.8rem; align-self: center; width: 100%; text-align: center; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.ph { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.ph .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph h3 { margin: 0; font-size: 1.15rem; }
.ph h3 small { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
.ph label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.ph input.label { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); unicode-bidi: plaintext; }
.meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--accent); }
.meter.warn b { background: var(--warn); } .meter.bad b { background: var(--bad); }
.auto { color: var(--muted); font-size: 0.85rem; }
.auto .ar { color: var(--ink); }
.who { color: var(--faint); font-size: 0.78rem; }
ol.items { list-style: none; margin: 0; padding: 0; }
.it { display: grid; grid-template-columns: auto 1.6rem minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 12px 9px 14px; border-bottom: 1px solid var(--line); }
.it.sel { background: var(--accent-soft); }
.it.hit { background: var(--gilt-soft); }
.it input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.it .num { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 0.8rem; text-align: end; }
.it .body { min-width: 0; display: grid; gap: 1px; }
.it .t { font-family: var(--f-title); font-weight: 700; font-size: 1.05rem; line-height: 1.35; overflow-wrap: anywhere; }
.it .a { font-family: var(--f-ar); font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
.it .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: 0.72rem; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.g { border-color: transparent; color: #fff; }
.chip.y { background: var(--gilt-soft); color: var(--gilt); border-color: transparent; }
.chip.v { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.it .ord { display: flex; flex-direction: column; gap: 2px; }
.it .ord button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 24px; cursor: pointer; font-size: 0.75rem; line-height: 1; color: var(--muted); }
.it .ord button:hover { border-color: var(--accent); color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.actions { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; border-radius: 0 0 var(--r) var(--r); }
.actions .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.actions .row > span { font-size: 0.85rem; color: var(--muted); margin-inline-end: 4px; }
.actions select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); max-width: 100%; }
.note { padding: 10px 14px; color: var(--muted); font-size: 0.82rem; }
.empty-panel { padding: 28px 16px; color: var(--muted); text-align: center; }

.list { padding-block: 8px 60px; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: start; vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--bg); position: sticky; top: 0; }
td.code { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
td .ar { display: block; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--accent-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 2px 0; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.banner { margin-top: 10px; padding: 10px 14px; border-radius: var(--r); background: var(--gilt-soft); color: var(--ink); font-size: 0.88rem; }
.toast { position: fixed; inset-inline: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; z-index: 20; }
.toast div { background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 0.85rem; box-shadow: var(--shadow); }
details.settings { margin-top: 10px; font-size: 0.85rem; }
details.settings summary { cursor: pointer; color: var(--muted); }
.settings .grid { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 10px 0; align-items: center; }
.settings input[type=number] { width: 4.5rem; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
@media (max-width: 520px) { .it { grid-template-columns: auto minmax(0, 1fr) auto; } .it .num { display: none; } }
@media (prefers-reduced-motion: reduce) { .spine.hit { animation: none; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><p class="sub" lang="ar" dir="rtl">خريطة رفوف المكتبة</p><h1>Darul Uloom Shelf Map</h1></div>
    <div class="stats" id="stats"></div>
  </header>
</div>
<div class="bar"><div class="wrap">
  <div class="barrow">
    <div class="find">
      <input id="q" type="search" dir="auto" autocomplete="off" placeholder="أين هذا الكتاب؟ · Find which shelf a book is on" aria-label="Find a book">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="seg" role="group" aria-label="View" id="view">
      <button type="button" data-view="case" aria-pressed="true">Bookcases</button>
      <button type="button" data-view="list" aria-pressed="false">All shelves</button>
    </div>
  </div>
  <div id="banner"></div>
</div></div>

<div class="wrap">
  <div class="strip" id="strip" aria-label="Bookcases"></div>
  <div id="main"></div>
  <details class="settings" id="settings"><summary>Shelf settings</summary>
    <div class="grid">
      <label>Volumes per level <input type="number" id="cap" min="10" max="120"></label>
      <label>Most a level can take <input type="number" id="max" min="10" max="150"></label>
      <label>Levels per bookcase <input type="number" id="lvls" min="1" max="10"></label>
      <label><input type="checkbox" id="rtl"> Books run right to left on the drawing</label>
    </div>
    <p class="note" style="padding:0 0 12px">Death years (AH) were added by Claude only to put books in rough chronological order; check any you rely on. Undated authors, mostly contemporary, sit at the end of each genre.</p>
  </details>
</div>
<div class="toast" id="toast" hidden><div></div></div>

<script>// Search engine for the library catalogue. Works in browser and node.
(function (root) {
  const DIAC = /[ً-ٰٟـۖ-ۭ]/g;
  const AR_FOLD = [
    [/[أإآٱ]/g, 'ا'], [/[ىیےئ]/g, 'ي'], [/[ةۃ]/g, 'ه'], [/[ھہ]/g, 'ه'], [/[کگ]/g, 'ك'],
    [/ؤ/g, 'و'], [/ء/g, ''], [/پ/g, 'ب'], [/چ/g, 'ج'], [/ژ/g, 'ز'], [/ٹ/g, 'ت'], [/ڈ/g, 'د'], [/ڑ/g, 'ر'], [/ں/g, 'ن'],
  ];

  // Spelling-insensitive text: folds Arabic/Urdu letter variants, removes harakat and the article ال.
  function norm(s) {
    if (!s) return '';
    s = s.normalize('NFKC').replace(DIAC, '').replace(/[ؤء]و/g, 'و');
    for (const [a, b] of AR_FOLD) s = s.replace(a, b);
    s = s.replace(/(\S{2,})وه(?=\s|$)/g, '$1اه');   // Urdu-style صلوة/زكوة/مشكوة = صلاة/زكاة/مشكاة
    s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/[ʿʾ’‘'`]/g, '');
    s = s.replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    return s.split(' ').map(w => (w.length > 3 && w.startsWith('ال')) ? w.slice(2) : (w.length > 4 && w.startsWith('وال')) ? w.slice(3) : w).join(' ');
  }

  // ---- consonant skeletons: let "Hidayah" find الهداية and tolerate spelling slips ----
  const AR_CLASS = {
    'ب': 'b', 'پ': 'b', 'ت': 't', 'ط': 't', 'ٹ': 't', 'ث': 's', 'س': 's', 'ص': 's', 'ج': 'j', 'چ': 'j',
    'ح': 'h', 'ه': 'h', 'ھ': 'h', 'ہ': 'h', 'خ': 'x', 'د': 'd', 'ض': 'd', 'ڈ': 'd', 'ذ': 'z', 'ز': 'z', 'ظ': 'z', 'ژ': 'z',
    'ر': 'r', 'ڑ': 'r', 'ش': 'c', 'غ': 'g', 'ف': 'f', 'ق': 'k', 'ك': 'k', 'ک': 'k', 'گ': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ں': 'n',
  };
  const ARTICLES = new Set(['al', 'el', 'ul', 'il', 'an', 'ar', 'as', 'ash', 'at', 'ad', 'adh', 'az', 'ath', 'ud', 'ur', 'us', 'ut', 'un', 'ush', 'uz', 'ad', 'wal', 'wa', 'the', 'of', 'and', 'a']);

  function collapse(s) { return s.replace(/(.)\1+/g, '$1'); }

  const AR_VOWEL = { 'ا': 'a', 'آ': 'a', 'أ': 'a', 'إ': 'a', 'ٱ': 'a', 'و': 'u', 'ي': 'i', 'ى': 'i', 'ی': 'i', 'ے': 'i' };

  // Arabic/Urdu word -> [{s: consonant skeleton, v: skeleton with long vowels}]
  function arWord(w) {
    w = w.normalize('NFKC').replace(DIAC, '');
    if (w.length > 3 && w.startsWith('ال')) w = w.slice(2);
    else if (w.length > 4 && w.startsWith('وال')) w = w.slice(3);
    // a final ة is silent ("Hidaya") or read as t ("Mishkat al-Masabih", "Hidayat"); keep both readings
    const taMarbuta = w.length > 2 && /[ةۃ]$/.test(w);
    if (w.length > 2) w = w.replace(/[ةۃه]$/, '');
    let s = '', v = '';
    for (const ch of w) {
      const c = AR_CLASS[ch];
      if (c) { s += c; v += c; } else if (AR_VOWEL[ch]) v += AR_VOWEL[ch];
    }
    s = collapse(s);
    if (!s) return [];
    const out = [{ s, v: collapse(v) }];
    if (taMarbuta) out.push({ s: collapse(s + 't'), v: collapse(v + 't') });
    return out;
  }

  // Latin transliteration -> one or more readings
  function latWord(w) {
    w = w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
    if (!w || ARTICLES.has(w)) return [];
    const forms = [w];
    const m = w.match(/^(.{3,}?)(ul|il|al|us|ush|ut|ud|ur|un|uz|ut)$/);
    if (m && w.length >= 5) forms.push(m[1]);           // "Fathul" -> "Fath", "Maariful" -> "Maarif"
    if (/^[a-z]{1,2}ul$/.test(w)) forms.push(w.slice(0, -2));   // "Dhul Fiqar"/"Zul"/"Abul" = ذو/أبو + ال
    const out = [], seen = new Set();
    for (const f0 of forms) {
      const hs = /[aeiou]h$/.test(f0) ? [f0.slice(0, -1), f0] : [f0];   // "-ah" may be ة or ح
      for (const f of hs) {
        let bases = [f.replace(/sh/g, 'C').replace(/kh/g, 'X').replace(/gh/g, 'G').replace(/ch/g, 'J').replace(/zh/g, 'Z').replace(/ph/g, 'F')];
        // "th"/"dh" can be ث/ذ (Uthmani) or Urdu aspirates ته/ده (Thanawi, Kandhlawi)
        if (bases[0].includes('th')) bases = bases.flatMap(b => [b.replace(/th/g, 'S'), b.replace(/th/g, 'TH')]);
        if (bases[0].includes('dh')) bases = bases.flatMap(b => [b.replace(/dh/g, 'Z'), b.replace(/dh/g, 'DH')]);
        // "kh"/"gh" can be خ/غ or Urdu aspirates كھ/گھ (Sakharvi, Gangohi)
        if (bases[0].includes('X')) bases = bases.flatMap(b => [b, b.replace(/X/g, 'KH')]);
        if (bases[0].includes('G')) bases = bases.flatMap(b => [b, b.replace(/G/g, 'GH')]);
        for (let v of bases) {
          v = v.replace(/q/g, 'k').replace(/c/g, 'k').replace(/g/g, 'k').replace(/p/g, 'b').replace(/x/g, 'ks').replace(/v/g, 'w');
          const vow = collapse(v.replace(/e/g, 'a').replace(/y/g, 'i').replace(/[ow]/g, 'u').toLowerCase().replace(/[^a-z]/g, ''));
          const sk = collapse(v.replace(/[aeiouwy]/g, '').toLowerCase().replace(/[^a-z]/g, ''));
          if (sk && !seen.has(sk + '|' + vow)) { seen.add(sk + '|' + vow); out.push({ s: sk, v: vow }); }
        }
      }
    }
    return out;
  }

  const isAr = s => /[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(s);

  function skelWords(text) {
    if (!text) return [];
    const words = text.normalize('NFKC').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    const out = [];
    for (const w of words) {
      const alts = isAr(w) ? arWord(w) : latWord(w);
      if (alts.length) out.push(alts);
    }
    return out;
  }

  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  const thr = n => n <= 3 ? 0 : n <= 5 ? 1 : 2;
  const vdist = (a, b) => lev(a, b, 99) / Math.max(a.length, b.length, 1);

  // best distance of one query word (alternatives) against a record's words
  function wordDist(qAlts, recWords, vw) {
    let best = 99;
    for (const q of qAlts) {
      const t = thr(q.s.length);
      for (let i = 0; i < recWords.length; i++) {
        for (const r of recWords[i]) {
          let d = r.s === q.s ? 0 : (q.s.length >= 4 && r.s.startsWith(q.s)) ? 0.5 : lev(q.s, r.s, t);
          if (d <= t) best = Math.min(best, d + vw * vdist(q.v, r.v));
          if (i + 1 < recWords.length && q.s.length >= 5) {
            for (const r2 of recWords[i + 1]) {
              const d2 = lev(q.s, collapse(r.s + r2.s), t);
              if (d2 <= t) best = Math.min(best, d2 + 0.3 + vw * vdist(q.v, r.v + r2.v));
            }
          }
        }
      }
    }
    return best;
  }

  const FIELDS = { all: ['t', 'a', 'm', 'p', 'o'], title: ['t'], author: ['a', 'm', 'o'], publisher: ['p'] };
  const WEIGHT = { t: 1, a: 0.8, m: 0.6, p: 0.4, o: 0.4 };

  function buildIndex(books) {
    for (const b of books) {
      b._n = {}; b._s = {};
      for (const f of ['t', 'a', 'm', 'p', 'o']) {
        b._n[f] = norm(b[f] || '');
        b._s[f] = skelWords(b[f] || '');
      }
      b._sortKey = b._n.t;
    }
    return books;
  }

  // Returns {exact:[{b,score}], close:[{b,score}]}
  function search(books, query, scope) {
    const fields = FIELDS[scope] || FIELDS.all;
    const nq = norm(query);
    const tokens = nq.split(' ').filter(Boolean);
    const qSkel = skelWords(query);
    const vw = isAr(query) ? 1.5 : 0.6;  // Arabic script writes long vowels, so vowel differences count more
    const exact = [], close = [];
    if (!tokens.length) return { exact, close };
    for (const b of books) {
      // exact (spelling-folded) match: every token found in the chosen fields
      let ok = true, score = 0;
      for (const tok of tokens) {
        let best = 0;
        for (const f of fields) {
          const txt = b._n[f];
          if (!txt) continue;
          const idx = (' ' + txt + ' ').indexOf(' ' + tok);
          if (idx >= 0) best = Math.max(best, WEIGHT[f] * ((' ' + txt + ' ').indexOf(' ' + tok + ' ') >= 0 ? 1.2 : 1));
          else if (txt.includes(tok)) best = Math.max(best, WEIGHT[f] * 0.7);
        }
        if (!best) { ok = false; break; }
        score += best;
      }
      if (ok) {
        for (const f of fields) {
          if (b._n[f] === nq) score += 3 * WEIGHT[f];
          else if (b._n[f].startsWith(nq)) score += 1.5 * WEIGHT[f];
        }
        exact.push({ b, score });
        continue;
      }
      // close match on consonant skeletons
      if (!qSkel.length || qSkel.reduce((n, a) => n + Math.max(...a.map(x => x.s.length)), 0) < 2) continue;
      let bestF = 99;
      for (const f of fields) {
        const rw = b._s[f];
        if (!rw.length) continue;
        let total = 0;
        for (const qa of qSkel) {
          const d = wordDist(qa, rw, vw);
          if (d > 3) { total = 99; break; }
          total += d;
        }
        if (total < 99) bestF = Math.min(bestF, total + (1 - WEIGHT[f]));
      }
      if (bestF < 99) close.push({ b, score: bestF });
    }
    exact.sort((x, y) => y.score - x.score || x.b._sortKey.localeCompare(y.b._sortKey, 'ar'));
    close.sort((x, y) => x.score - y.score || x.b._sortKey.localeCompare(y.b._sortKey, 'ar'));
    // keep only close matches near the best one
    if (exact.length) return { exact, close: close.filter(x => x.score <= (isAr(query) ? 0.4 : 0.6)).slice(0, isAr(query) ? 30 : 80) };
    const cut = close.length ? Math.min(close[0].score + 0.9, 3) : 0;
    return { exact, close: close.filter(x => x.score <= cut).slice(0, 80) };
  }

  root.LibSearch = { norm, skelWords, buildIndex, search };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = n => n.toLocaleString('en-GB');
  const BOOKS = JSON.parse($('#books').textContent);
  const CATS = JSON.parse($('#cats').textContent);
  const START = JSON.parse($('#start').textContent);
  const BY = new Map(BOOKS.map(b => [b.id, b]));
  LibSearch.buildIndex(BOOKS);
  // genre colours: Qur'an greens, hadith blues, fiqh reds, belief violet, history ochres, spirituality teals, language slates
  const GC = ['#2f6b4f', '#4d8a62', '#7aa36b', '#2c5a8a', '#3f74a8', '#5f8fbf', '#8a2f2f', '#a8473d', '#c0675b', '#5b4a8a',
              '#a0702a', '#b88a3a', '#2f7a7a', '#4f9a94', '#4a5568', '#647187', '#7c879a', '#94a0b0', '#8a7a5a', '#a08a60', '#6b6b6b', '#808080'];
  const genreColor = k => GC[k % GC.length];

  // ---------- state ----------
  let cfg = { cases: START.cases, capacity: START.capacity, max: START.max, levels: START.levels || 6 };
  let shelves = new Map(START.shelves.map(s => [s.id, { ...s, items: s.items.slice() }]));
  if (!shelves.has('tray')) shelves.set('tray', { id: 'tray', case: '', level: 0, label: '', items: [] });
  let mode = 'start';              // 'start' (built-in layout, read-only) | 'live' | 'readonly-live'
  let db = null, user = null, uid = null, canWrite = false;
  const ui = { view: 'case', caseId: cfg.cases[0]?.id, shelfId: null, sel: new Set(), hit: null, rtl: true, titles: true, moving: false };
  try { const v = localStorage.getItem('shelfmap.rtl'); if (v !== null) ui.rtl = v === '1'; const w = localStorage.getItem('shelfmap.titles'); if (w !== null) ui.titles = w === '1'; } catch (e) {}
  const names = new Map();

  const used = s => s.items.reduce((n, it) => n + it.n, 0);
  function levelsOf(c) { let n = cfg.levels; for (const s of shelves.values()) if (s.case === c && s.items.length && s.level > n) n = s.level; return Array.from({ length: n }, (_, i) => i + 1); }
  const shelvesOf = c => levelsOf(c).map(l => { const id = `${c}-${l}`; if (!shelves.has(id)) shelves.set(id, { id, case: c, level: l, label: '', items: [] }); return shelves.get(id); });
  const totalOf = id => { const b = BY.get(id); return b ? b.v * (b.c || 1) : 0; };
  function locate(id) {
    const out = [];
    for (const s of shelves.values()) s.items.forEach((it, i) => { if (it.b === id) out.push({ s, i }); });
    return out;
  }
  const code = s => s.id === 'tray' ? 'Tray' : `${s.case}${s.level}`;
  function genreSummary(s) {
    const g = new Map();
    for (const it of s.items) { const b = BY.get(it.b); if (b) g.set(b.k, (g.get(b.k) || 0) + it.n); }
    return [...g.entries()].sort((a, b) => b[1] - a[1]);
  }
  function autoLabel(s) {
    const g = genreSummary(s);
    if (!g.length) return '';
    return g.slice(0, 2).map(([k]) => CATS[k].ar).join(' · ');
  }
  function fillClass(n) { return n > cfg.max ? 'bad' : n > cfg.capacity ? 'warn' : ''; }

  // ---------- rendering ----------
  function renderStats() {
    let placed = 0, levels = 0;
    for (const s of shelves.values()) { if (s.id !== 'tray') { placed += used(s); levels++; } }
    const tray = used(shelves.get('tray'));
    const pill = mode === 'live' ? '<span class="pill live"><i></i>Live · changes save for everyone</span>'
      : mode === 'readonly-live' ? '<span class="pill ro"><i></i>Live · view only</span>'
      : '<span class="pill ro"><i></i>Saved copy · 13 Oct 2026</span>';
    $('#stats').innerHTML = `<span><b>${cfg.cases.length}</b> cases</span><span><b>${levels}</b> levels</span><span><b>${fmt(placed)}</b> volumes shelved</span>${tray ? `<span><b>${tray}</b> in tray</span>` : ''}${pill}`;
  }
  function renderBanner() {
    let msg = '';
    if (mode === 'start' && !db) msg = 'This is the layout of the shelves as saved on 13 Oct 2026, for finding books. Books are moved in the Shelf Map in Claude, and this app gets the new layout at its next update.';
    else if (mode === 'start' && db) msg = 'The shared shelves have not been set up yet, so this is the starting layout and changes will not be saved.';
    else if (mode === 'readonly-live') msg = 'You can look but not move books. Ask the owner for edit access to make changes.';
    $('#banner').innerHTML = msg ? `<div class="banner">${esc(msg)}</div>` : '';
  }
  function renderStrip() {
    const tiles = cfg.cases.map(c => {
      const ss = shelvesOf(c.id);
      const g = new Map(); let n = 0;
      ss.forEach(s => genreSummary(s).forEach(([k, v]) => { g.set(k, (g.get(k) || 0) + v); n += v; }));
      const top = [...g.entries()].sort((a, b) => b[1] - a[1])[0];
      const bars = ss.map(s => { const u = used(s); const gs = genreSummary(s)[0]; return `<span><b style="width:${Math.min(100, u / cfg.capacity * 100)}%;background:${gs ? genreColor(gs[0]) : 'transparent'}"></b></span>`; }).join('');
      return `<button class="ctile" data-case="${esc(c.id)}" aria-current="${ui.view === 'case' && ui.caseId === c.id}"><span class="cl">${esc(c.id)}<small>${n}</small></span><span class="cg" lang="ar">${top ? esc(CATS[top[0]].ar) : '—'}</span><span class="mini">${bars}</span></button>`;
    });
    const tray = shelves.get('tray');
    tiles.push(`<button class="ctile tray" data-case="tray" aria-current="${ui.view === 'case' && ui.caseId === 'tray'}"><span class="cl">Tray<small>${used(tray)}</small></span><span class="cg">unplaced books</span></button>`);

  function spinesHTML(s) {
    if (!s.items.length) return '<span class="empty">empty</span>';
    return s.items.map(it => {
      const b = BY.get(it.b); const k = b ? b.k : 0;
      const h = 72 + ((it.b.length * 7 + it.n * 3) % 25);
      const hit = ui.hit && ui.hit === it.b ? ' hit' : '';
      const h2 = ui.titles ? 84 + ((it.b.length * 7 + it.n * 3) % 17) : h;
      const txt = ui.titles ? `<span class="st">${esc(b ? b.t : it.b)}</span>${it.n > 1 ? `<span class="sv">${it.n}</span>` : ''}` : '';
      return `<span class="spine${hit}" style="--n:${it.n};height:${h2}%;background:${genreColor(k)}" title="${esc(b ? b.t : it.b)}">${txt}</span>`;
    }).join('');
  }
  function renderCase() {
    if (ui.caseId === 'tray') return `<div class="case"><div class="casehead"><h2>Tray <span style="font-weight:400;opacity:.8">books not on a shelf</span></h2></div>
      ${levelHTML(shelves.get('tray'), 'Tray')}</div>`;
    const c = cfg.cases.find(x => x.id === ui.caseId) || cfg.cases[0];
    if (!c) return '<div class="empty-panel">No bookcases yet.</div>';
    ui.caseId = c.id;
    const ss = shelvesOf(c.id);
    const empty = ss.every(s => !s.items.length);
    return `<div class="case"><div class="casehead"><h2>${canWrite ? `<input id="casename" value="${esc(c.name)}" aria-label="Case name">` : esc(c.name)}</h2>
      <div class="tools"><button class="btn" id="titles" aria-pressed="${ui.titles}">${ui.titles ? 'Hide titles' : 'Show titles'}</button><button class="btn" id="prevcase" ${idx(c) === 0 ? 'disabled' : ''}>‹ ${esc(cfg.cases[idx(c) - 1]?.id || '')}</button><button class="btn" id="nextcase" ${idx(c) === cfg.cases.length - 1 ? 'disabled' : ''}>${esc(cfg.cases[idx(c) + 1]?.id || '')} ›</button>${canWrite && empty && idx(c) === cfg.cases.length - 1 ? '<button class="btn danger" id="delcase">Remove case</button>' : ''}</div></div>
      ${ss.map(s => levelHTML(s, `${c.id}${s.level}`)).join('')}</div>`;
  }
  const idx = c => cfg.cases.findIndex(x => x.id === c.id);
  function levelHTML(s, label) {
    const u = used(s);
    const lab = s.label || autoLabel(s);
    return `<div class="level${u > cfg.max ? ' over' : ''}" role="button" tabindex="0" data-shelf="${esc(s.id)}" aria-pressed="${ui.shelfId === s.id}">
      <span class="lvhead"><span class="code">${esc(label)}</span><span class="lab" dir="auto">${esc(lab)}</span><span class="fill ${fillClass(u)}">${u}${s.id === 'tray' ? '' : ' / ' + cfg.capacity}</span></span>
      <span class="cavity${ui.rtl ? ' rtl' : ''}${ui.titles ? ' titled' : ''}">${spinesHTML(s)}</span><span class="plank" style="display:block"></span></div>`;
  }
  function renderPanel() {
    const s = shelves.get(ui.shelfId);
    if (!s) return `<div class="panel"><div class="empty-panel">Tap a shelf to see the books on it, put them in order, or move them.</div></div>`;
    const u = used(s);
    const g = genreSummary(s);
    const items = s.items.map((it, i) => {
      const b = BY.get(it.b) || { t: it.b, a: '', k: 0 };
      const tot = totalOf(it.b);
      const vol = it.n === tot ? (tot === 1 ? '1 vol' : `${tot} vols`) : `${it.n} of ${tot} vols`;
      const cp = (b.c || 1) > 1 ? ` · ${b.c} copies` : '';
      return `<li class="it${ui.sel.has(i) ? ' sel' : ''}${ui.hit === it.b ? ' hit' : ''}" data-i="${i}">
        ${canWrite ? `<input type="checkbox" data-sel="${i}" ${ui.sel.has(i) ? 'checked' : ''} aria-label="Select">` : '<span></span>'}
        <span class="num">${i + 1}</span>
        <span class="body"><span class="t" dir="auto">${esc(b.t)}</span>${b.a ? `<span class="a" dir="auto">${esc(b.a)}</span>` : ''}
          <span class="chips"><span class="chip g" style="background:${genreColor(b.k)}">${esc(CATS[b.k].en)}</span><span class="chip v">${vol}${cp}</span>${b.y ? `<span class="chip y">d. ${b.y} AH</span>` : ''}</span></span>
        ${canWrite ? `<span class="ord"><button data-up="${i}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>▲</button><button data-down="${i}" aria-label="Move down" ${i === s.items.length - 1 ? 'disabled' : ''}>▼</button></span>` : '<span></span>'}
      </li>`;
    }).join('');
    const who = s.updatedBy ? `Last changed by ${esc(names.get(s.updatedBy) || 'someone')}${s.updatedAt ? ' · ' + ago(s.updatedAt) : ''}` : '';
    const opts = levelOptions(s.id);
    const n = ui.sel.size;
    return `<div class="panel" id="panel">
      <div class="ph">
        <div class="row"><h3>${s.id === 'tray' ? 'Tray' : `Case ${esc(s.case)} · Level ${s.level}`} <small>${s.id === 'tray' ? '' : s.level === 1 ? '(top)' : s.level === levelsOf(s.case).length ? '(bottom)' : ''}</small></h3><span class="who">${who}</span></div>
        ${s.id !== 'tray' ? `<div class="meter ${fillClass(u)}"><b style="width:${Math.min(100, u / cfg.max * 100)}%"></b></div>
        <div class="row"><span class="auto">${u} of ${cfg.capacity} volumes${u > cfg.max ? ' · over the limit' : ''}</span><span class="auto">${g.map(([k, v]) => `<span class="ar">${esc(CATS[k].ar)}</span> ${v}`).join(' · ')}</span></div>
        <div><label for="shelflabel">Shelf label</label>
        <input class="label" id="shelflabel" dir="auto" value="${esc(s.label)}" placeholder="${esc(autoLabel(s) || 'e.g. شروح البخاري')}" ${canWrite ? '' : 'disabled'}></div>` : '<span class="auto">Books taken off a shelf wait here until you put them somewhere.</span>'}
      </div>
      ${s.items.length ? `<ol class="items">${items}</ol>` : '<div class="empty-panel">No books here.</div>'}
      ${canWrite && s.items.length ? `<div class="actions">
        <div class="row"><button class="btn" id="selall">${n === s.items.length ? 'Clear selection' : 'Select all'}</button>
          ${s.id !== 'tray' ? '<button class="btn" id="sortdate">Sort this shelf by date</button>' : ''}<span>${n ? n + ' selected' : 'Tick books to move them'}</span></div>
        ${n ? `<div class="row">${s.id !== 'tray' ? `<button class="btn" id="toprev">◀ Previous level</button><button class="btn" id="tonext">Next level ▶</button>` : ''}
          <select id="dest" aria-label="Move to">${opts}</select>
          <select id="pos" aria-label="Where on that shelf"><option value="end">at the end</option><option value="start">at the start</option></select>
          <button class="btn primary" id="move">Move</button>${s.id !== 'tray' ? '<button class="btn" id="totray">To tray</button>' : ''}</div>` : ''}
      </div>` : ''}
    </div>`;
  }
  function levelOptions(exclude) {
    const out = [];
    for (const c of cfg.cases) for (const s of shelvesOf(c.id)) if (s.id !== exclude) out.push(`<option value="${esc(s.id)}">${esc(c.id)}${s.level} · ${used(s)}/${cfg.capacity} · ${esc(s.label || autoLabel(s) || 'empty')}</option>`);
    if (exclude !== 'tray') out.push('<option value="tray">Tray</option>');
    return out.join('');
  }
  function renderList() {
    const rows = [];
    for (const c of cfg.cases) for (const s of shelvesOf(c.id)) {
      const u = used(s); const first = BY.get(s.items[0]?.b); const last = BY.get(s.items[s.items.length - 1]?.b);
      rows.push(`<tr class="clickable" data-go="${esc(s.id)}"><td class="code">${esc(c.id)}${s.level}</td><td><span class="ar" dir="auto">${esc(s.label || autoLabel(s))}</span></td>
        <td class="num ${fillClass(u)}">${u}</td><td>${first ? `<span class="ar" dir="auto">${esc(first.t)}</span>` : '—'}</td><td>${last && last !== first ? `<span class="ar" dir="auto">${esc(last.t)}</span>` : ''}</td></tr>`);
    }
    const legend = [...new Set(BOOKS.map(b => b.k))].sort((a, b) => a - b).map(k => `<span><i class="dot" style="background:${genreColor(k)}"></i>${esc(CATS[k].en)}</span>`).join('');
    return `<div class="list"><div class="tbl"><table><thead><tr><th>Shelf</th><th>Label</th><th>Vols</th><th>First book</th><th>Last book</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><div class="legend">${legend}</div></div>`;
  }
  function render() {
    renderStats(); renderBanner(); renderStrip();
    for (const b of $('#view').children) b.setAttribute('aria-pressed', String(b.dataset.view === ui.view));
    if (ui.view === 'list') { $('#main').innerHTML = renderList(); return; }
    const legend = [...new Set([...shelves.values()].filter(s => s.case === ui.caseId).flatMap(s => s.items.map(it => BY.get(it.b)?.k)).filter(k => k !== undefined))]
      .map(k => `<span><i class="dot" style="background:${genreColor(k)}"></i>${esc(CATS[k].en)}</span>`).join('');
    $('#main').innerHTML = `<div class="work"><div>${renderCase()}<div class="legend">${legend}</div></div>${renderPanel()}</div>`;
    $('#cap').value = cfg.capacity; $('#max').value = cfg.max; $('#lvls').value = cfg.levels; $('#rtl').checked = ui.rtl;
    $('#cap').disabled = $('#max').disabled = !canWrite;
  }
  function ago(t) {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60); if (h < 24) return `${h} h ago`;
    return new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.firstElementChild.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

  // ---------- writes ----------
  const queue = new Map();   // one write at a time per shelf document
  function save(ids) {
    if (mode !== 'live') return;
    for (const id of new Set(ids)) {
      const s = shelves.get(id); if (!s) continue;
      const body = { items: s.items.map(it => ({ b: it.b, n: it.n })), label: s.label || '', updatedAt: Date.now(), updatedBy: uid || '' };
      s.updatedAt = body.updatedAt; s.updatedBy = body.updatedBy;
      const prev = queue.get(id) || Promise.resolve();
      const p = prev.then(() => db.doc('shelves/' + id).set({ id, case: s.case, level: s.level, ...body }))
        .catch(e => { toast(e?.code === 'invalid_argument' ? 'You do not have permission to change shelves' : 'Could not save: ' + (e?.code || 'error')); if (e?.code === 'invalid_argument') { canWrite = false; mode = 'readonly-live'; render(); } });
      queue.set(id, p);
    }
  }
  function saveCfg() {
    if (mode !== 'live') return;
    db.doc('config/main').set({ cases: cfg.cases, capacity: cfg.capacity, max: cfg.max, levels: cfg.levels }).catch(e => toast('Could not save settings: ' + (e?.code || 'error')));
  }
  function moveSelected(destId, pos) {
    const src = shelves.get(ui.shelfId), dst = shelves.get(destId);
    if (!src || !dst || src === dst) return;
    const idxs = [...ui.sel].sort((a, b) => a - b);
    const moving = idxs.map(i => src.items[i]);
    src.items = src.items.filter((_, i) => !ui.sel.has(i));
    dst.items = pos === 'start' ? [...moving, ...dst.items] : [...dst.items, ...moving];
    // merge split parts of the same set that end up side by side
    dst.items = dst.items.reduce((acc, it) => { const last = acc[acc.length - 1]; if (last && last.b === it.b) last.n += it.n; else acc.push({ ...it }); return acc; }, []);
    ui.sel.clear();
    save([src.id, dst.id]);
    const n = used(dst);
    toast(`Moved ${moving.length} ${moving.length === 1 ? 'book' : 'books'} to ${code(dst)}${n > cfg.max ? ' · that shelf is now over the limit' : ''}`);
    render();
  }
  function neighbour(id, dir) {
    const order = []; for (const c of cfg.cases) for (const s of shelvesOf(c.id)) order.push(s.id);
    const i = order.indexOf(id); return order[i + dir];
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target;
    const caseBtn = t.closest('[data-case]');
    if (caseBtn) { ui.view = 'case'; ui.caseId = caseBtn.dataset.case; ui.shelfId = ui.caseId === 'tray' ? 'tray' : null; ui.sel.clear(); render(); return; }
    const lv = t.closest('[data-shelf]');
    if (lv) { if (ui.shelfId !== lv.dataset.shelf) ui.sel.clear(); ui.shelfId = lv.dataset.shelf; render(); if (window.innerWidth <= 900) $('#panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    const go = t.closest('[data-go]');
    if (go) { const s = shelves.get(go.dataset.go); ui.view = 'case'; ui.caseId = s.case; ui.shelfId = s.id; ui.sel.clear(); render(); window.scrollTo({ top: 0 }); return; }
    const res = t.closest('[data-find]');
    if (res) { const [sid, bid] = res.dataset.find.split('|'); const s = shelves.get(sid); ui.view = 'case'; ui.caseId = s.id === 'tray' ? 'tray' : s.case; ui.shelfId = sid; ui.hit = bid; ui.sel.clear(); $('#results').hidden = true; render(); document.querySelector('.spine.hit')?.scrollIntoView({ inline: 'center', block: 'nearest' }); document.querySelector('.it.hit')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    if (t.closest('#view button')) { ui.view = t.closest('button').dataset.view; render(); return; }
    if (t.id === 'titles') { ui.titles = !ui.titles; try { localStorage.setItem('shelfmap.titles', ui.titles ? '1' : '0'); } catch (err) {} render(); return; }
    if (t.id === 'prevcase' || t.id === 'nextcase') { const c = cfg.cases.find(x => x.id === ui.caseId); const n = cfg.cases[idx(c) + (t.id === 'nextcase' ? 1 : -1)]; if (n) { ui.caseId = n.id; ui.shelfId = null; ui.sel.clear(); render(); } return; }
    if (!canWrite) return;
    const s = shelves.get(ui.shelfId);
    if (t.dataset.up !== undefined || t.dataset.down !== undefined) {
      const i = +(t.dataset.up ?? t.dataset.down), j = t.dataset.up !== undefined ? i - 1 : i + 1;
      if (j < 0 || j >= s.items.length) return;
      [s.items[i], s.items[j]] = [s.items[j], s.items[i]];
      const si = ui.sel.has(i), sj = ui.sel.has(j); ui.sel.delete(i); ui.sel.delete(j); if (si) ui.sel.add(j); if (sj) ui.sel.add(i);
      save([s.id]); render(); return;
    }
    if (t.id === 'selall') { if (ui.sel.size === s.items.length) ui.sel.clear(); else s.items.forEach((_, i) => ui.sel.add(i)); render(); return; }
    if (t.id === 'sortdate') {
      s.items.sort((x, y) => { const a = BY.get(x.b) || {}, b = BY.get(y.b) || {}; return ((a.y == null) - (b.y == null)) || ((a.y || 0) - (b.y || 0)) || String(a.a).localeCompare(String(b.a), 'ar') || String(a.t).localeCompare(String(b.t), 'ar'); });
      ui.sel.clear(); save([s.id]); render(); toast('Shelf sorted by death year'); return;
    }
    if (t.id === 'toprev' || t.id === 'tonext') { const d = neighbour(s.id, t.id === 'tonext' ? 1 : -1); if (!d) { toast('No shelf in that direction'); return; } moveSelected(d, t.id === 'tonext' ? 'start' : 'end'); return; }
    if (t.id === 'move') { moveSelected($('#dest').value, $('#pos').value); return; }
    if (t.id === 'totray') { moveSelected('tray', 'end'); return; }
    if (t.id === 'addcase') {
      const last = cfg.cases[cfg.cases.length - 1]?.id || '@';
      const id = nextId(last);
      cfg.cases = [...cfg.cases, { id, name: `Case ${id}` }];
      const made = levelsOf(id).map(l => { const sh = { id: `${id}-${l}`, case: id, level: l, label: '', items: [] }; shelves.set(sh.id, sh); return sh.id; });
      saveCfg(); save(made); ui.caseId = id; ui.shelfId = null; render(); toast(`Added case ${id}`); return;
    }
    if (t.id === 'delcase') {
      const c = cfg.cases.find(x => x.id === ui.caseId);
      if (shelvesOf(c.id).some(x => x.items.length)) return;
      cfg.cases = cfg.cases.filter(x => x.id !== c.id);
      for (const x of [...shelves.values()].filter(x => x.case === c.id)) { shelves.delete(x.id); if (mode === 'live') db.doc(`shelves/${x.id}`).delete().catch(() => {}); }
      saveCfg(); ui.caseId = cfg.cases[cfg.cases.length - 1]?.id; ui.shelfId = null; render(); toast(`Removed case ${c.id}`); return;
    }
  });
  function nextId(id) { const a = id.split(''); let i = a.length - 1; while (i >= 0) { if (a[i] === 'Z') { a[i] = 'A'; i--; } else { a[i] = String.fromCharCode(a[i].charCodeAt(0) + 1); return a.join(''); } } return 'A' + a.join(''); }
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.sel !== undefined) { const i = +t.dataset.sel; t.checked ? ui.sel.add(i) : ui.sel.delete(i); render(); return; }
    if (t.id === 'rtl') { ui.rtl = t.checked; try { localStorage.setItem('shelfmap.rtl', ui.rtl ? '1' : '0'); } catch (err) {} render(); return; }
    if (!canWrite) return;
    if (t.id === 'shelflabel') { const s = shelves.get(ui.shelfId); s.label = t.value.trim(); save([s.id]); render(); toast('Label saved'); return; }
    if (t.id === 'casename') { const c = cfg.cases.find(x => x.id === ui.caseId); c.name = t.value.trim() || `Case ${c.id}`; saveCfg(); render(); return; }
    if (t.id === 'lvls') { cfg.levels = Math.max(1, Math.min(10, parseInt(t.value, 10) || 6)); saveCfg(); render(); return; }
    if (t.id === 'cap' || t.id === 'max') { const v = Math.max(10, Math.min(150, parseInt(t.value, 10) || 0)); cfg[t.id === 'cap' ? 'capacity' : 'max'] = v; if (cfg.max < cfg.capacity) cfg.max = cfg.capacity; saveCfg(); render(); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('.level[data-shelf]')) { e.preventDefault(); e.target.click(); return; } if (e.key === 'Enter' && (e.target.id === 'shelflabel' || e.target.id === 'casename')) e.target.blur(); if (e.key === 'Escape') $('#results').hidden = true; });

  // find a book
  let ft;
  $('#q').addEventListener('input', () => { clearTimeout(ft); ft = setTimeout(find, 140); });
  $('#q').addEventListener('focus', () => { if ($('#q').value.trim()) find(); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.find')) $('#results').hidden = true; });
  function find() {
    const q = $('#q').value.trim(); const box = $('#results');
    if (!q) { box.hidden = true; return; }
    const r = LibSearch.search(BOOKS, q, 'all');
    const list = [...r.exact, ...r.close].slice(0, 30).map(x => x.b);
    if (!list.length) { box.innerHTML = '<div class="note">No book matches that.</div>'; box.hidden = false; return; }
    box.innerHTML = list.map(b => {
      const loc = locate(b.id);
      const where = loc.length ? [...new Set(loc.map(l => code(l.s)))].join(', ') : 'not shelved';
      const target = loc[0] ? `${loc[0].s.id}|${b.id}` : '';
      return `<button class="res" ${target ? `data-find="${esc(target)}"` : 'disabled'}><span class="rt" dir="auto">${esc(b.t)}</span><span class="ra" dir="auto">${esc(b.a || '')}</span><span class="rl">${esc(where)}</span></button>`;
    }).join('');
    box.hidden = false;
  }

  // ---------- live data ----------
  render();
  (async () => {
    db = await window.claude?.use?.('db');
    if (!db) { render(); return; }
    user = await window.claude.use('user');
    uid = user ? await user.id() : null;
    const can = user ? await user.can('data.write') : null;
    let first = true;
    db.doc('config/main').onSnapshot(snap => {
      if (!snap.exists) return;
      const d = snap.data();
      cfg = { cases: d.cases || [], capacity: d.capacity || 70, max: d.max || 75, levels: d.levels || 6 };
      render();
    }, e => toast('Lost connection to the shelves: ' + e.code));
    db.collection('shelves').limit(1000).onSnapshot(snap => {
      if (snap.empty) { if (first) { mode = 'start'; render(); } first = false; return; }
      const next = new Map();
      snap.docs.forEach(d => { const v = d.data(); next.set(d.id, { id: d.id, case: v.case || '', level: v.level || 0, label: v.label || '', items: (v.items || []).map(it => ({ b: it.b, n: it.n })), updatedAt: v.updatedAt, updatedBy: v.updatedBy }); });
      if (!next.has('tray')) next.set('tray', { id: 'tray', case: '', level: 0, label: '', items: [] });
      shelves = next;
      // the selection refers to positions; drop it if another person changed this shelf
      if (!first && snap.docChanges().some(ch => ch.doc.id === ui.shelfId && !ch.doc.metadata.hasPendingWrites)) ui.sel.clear();
      mode = can === false ? 'readonly-live' : 'live';
      canWrite = mode === 'live';
      first = false;
      const ids = [...new Set([...shelves.values()].map(s => s.updatedBy).filter(Boolean))].filter(id => !names.has(id));
      if (ids.length && user) user.profiles(ids).then(ps => { for (const id of ids) names.set(id, ps[id]?.name || ''); render(); }).catch(() => {});
      render();
    }, e => toast('Lost connection to the shelves: ' + e.code));
  })();
})();
</script>

<script>
// Offline app: keep the library on this device and show whether it is ready to use without signal.
(function () {
  var foot = document.getElementById(null);
  var note = document.createElement('span'); note.className = 'offline-note';
  function say(ok, text) { note.className = 'offline-note' + (ok ? ' ok' : ''); note.innerHTML = '<i></i>' + text; if (!note.parentNode && foot) foot.appendChild(note); }
  if (!('serviceWorker' in navigator) || !('caches' in window)) { if (foot) say(false, 'This browser can’t save the library for offline use.'); return; }
  var page = location.href.split('#')[0].split('?')[0]; if (/\/$/.test(page)) page += 'index.html';
  function check() {
    return caches.match(page).then(function (hit) {
      if (!foot) return !!hit;
      if (hit) say(true, 'Saved on this device · works without signal' + (navigator.onLine ? '' : ' · you’re offline now'));
      else if (navigator.onLine) say(false, 'Saving to this device…');
      else say(false, 'Not saved yet. Open the app once with signal.');
      return !!hit;
    }).catch(function () { return false; });
  }
  check();
  var hadController = !!navigator.serviceWorker.controller;
  // Registering also looks for a newer version. With no signal that look fails, which is fine: the saved copy keeps working.
  navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
    .then(function () { return navigator.serviceWorker.ready; })
    .then(function () { setTimeout(check, 400); })
    .catch(function () { check().then(function (ok) { if (!ok && navigator.onLine && foot) say(false, 'Couldn’t save for offline use yet. Close the app and open it again with signal.'); }); });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !sessionStorage.getItem('du-reloaded')) { try { sessionStorage.setItem('du-reloaded', '1'); } catch (e) {} location.reload(); }
  });
  window.addEventListener('offline', check); window.addEventListener('online', check);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
