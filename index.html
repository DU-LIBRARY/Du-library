<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Search the Darul Uloom library catalogue, even without signal.">
<meta name="theme-color" content="#0e5a48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Darul Uloom Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single catalogue column. Sticky search desk on top, subject shelves when idle, index-card entries when searching. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --ink: #17221e;
  --muted: #5a6762;
  --faint: #8a9690;
  --line: #dde3df;
  --accent: #0e5a48;
  --accent-soft: #e2efea;
  --accent-ink: #ffffff;
  --gilt: #a7762a;
  --gilt-soft: #f6eddc;
  --mark: #fbe7a8;
  --f-title: "Amiri", "Noto Naskh Arabic", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ar: "IBM Plex Sans Arabic", "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
  --r: 10px;
  --shadow: 0 1px 2px rgb(16 40 32 / 6%), 0 4px 16px rgb(16 40 32 / 5%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
    --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519; --mark: #5a4a17;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1b; --ink: #e5ece9; --muted: #9eaca6; --faint: #6f7d77; --line: #26322e;
  --accent: #6cc4a8; --accent-soft: #1b3029; --accent-ink: #0b1411; --gilt: #d8ab5f; --gilt-soft: #2c2519; --mark: #5a4a17;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { padding-block: 28px 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: end; justify-content: space-between; }
.brand h1 { font-family: var(--f-title); font-weight: 700; font-size: clamp(1.7rem, 4.5vw, 2.3rem); line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.brand .ar { font-family: var(--f-title); color: var(--gilt); font-size: 1.15rem; margin: 0 0 2px; }
.stats { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; display: flex; gap: 14px; flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 600; }

.desk { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px 12px; border-bottom: 1px solid var(--line); }
.searchbox { position: relative; }
.searchbox svg { position: absolute; inset-inline-start: 14px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
#q { width: 100%; padding: 13px 44px 13px 42px; font-size: 1.05rem; border: 1.5px solid var(--line); border-radius: var(--r); background: var(--surface); box-shadow: var(--shadow); unicode-bidi: plaintext; }
#q::placeholder { color: var(--faint); }
#q::-webkit-search-cancel-button, #q::-webkit-search-decoration { -webkit-appearance: none; appearance: none; display: none; }
#q:focus { border-color: var(--accent); outline: none; }
#clearq { position: absolute; inset-inline-end: 8px; top: 50%; translate: 0 -50%; border: 0; background: transparent; width: 32px; height: 32px; border-radius: 50%; color: var(--muted); cursor: pointer; font-size: 1.2rem; line-height: 1; }
#clearq:hover { background: var(--accent-soft); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.controls select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 28px 6px 12px; font-size: 0.85rem; max-width: 100%; min-width: 0; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.controls select.on { border-color: var(--accent); color: var(--accent); font-weight: 500; }
.reset { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 0.85rem; padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }

main { padding-block: 18px 60px; }
.sectionhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
.sectionhead h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; margin: 0; }
.sectionhead .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }

/* Shelves */
.shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.shelf { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; transition: border-color .15s, transform .15s; }
.shelf:hover { border-color: var(--accent); }
.shelf .sar { font-family: var(--f-title); font-size: 1.3rem; font-weight: 700; line-height: 1.3; direction: rtl; text-align: right; grid-column: 1 / -1; }
.shelf .sen { font-size: 0.8rem; color: var(--muted); }
.shelf .sn { font-size: 0.8rem; color: var(--gilt); font-variant-numeric: tabular-nums; font-weight: 600; }
.shelf.collection { background: var(--gilt-soft); border-color: transparent; }
.hint { color: var(--muted); font-size: 0.88rem; margin: 22px 0 0; max-width: 62ch; }
.hint kbd { font-family: var(--f-ui); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 0.8rem; background: var(--surface); }

/* Entries */
ol.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.entry { padding: 14px 4px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.entry[dir="rtl"] { text-align: right; }
.entry .t { font-family: var(--f-title); font-size: 1.28rem; font-weight: 700; line-height: 1.35; margin: 0; overflow-wrap: anywhere; }
.entry[dir="ltr"] .t { font-size: 1.15rem; }
.entry .by { color: var(--ink); font-size: 0.95rem; overflow-wrap: anywhere; }
.entry[dir="rtl"] .by, .entry[dir="rtl"] .pub { font-family: var(--f-ar); }
.linkish { background: none; border: 0; padding: 0; color: inherit; cursor: pointer; text-align: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; }
.linkish:hover { text-decoration-color: var(--accent); color: var(--accent); }
.entry .role { color: var(--faint); font-size: 0.78rem; font-family: var(--f-ui); }
.entry .pub { color: var(--muted); font-size: 0.88rem; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); white-space: nowrap; font-family: var(--f-ui); max-width: 100%; }
.chip.cat { background: var(--accent-soft); border-color: transparent; color: var(--accent); cursor: pointer; }
.chip.cat .car { font-family: var(--f-ar); }
.chip.gold { background: var(--gilt-soft); border-color: transparent; color: var(--gilt); }
.spines { display: inline-flex; gap: 1.5px; align-items: end; height: 12px; }
.spines i { display: block; width: 3px; background: var(--gilt); border-radius: 1px; }
.notes { color: var(--muted); font-size: 0.84rem; font-style: italic; overflow-wrap: anywhere; }
details.more { font-size: 0.82rem; color: var(--muted); }
details.more summary { cursor: pointer; color: var(--faint); width: fit-content; }
details.more p { white-space: pre-line; margin: 6px 0; max-width: 70ch; color: var(--ink); line-height: 1.6; }
details.more .src { font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.divider { margin: 26px 0 4px; padding-top: 6px; display: grid; gap: 2px; }
.divider h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--gilt); font-weight: 600; margin: 0; }
.divider p { margin: 0; color: var(--muted); font-size: 0.85rem; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 0 18px; }
.nm { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 9px 2px; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: start; min-width: 0; }
.nm:hover .nn { color: var(--accent); }
.nm .nn { font-family: var(--f-ar); font-size: 0.95rem; overflow-wrap: anywhere; min-width: 0; }
.nm .nc { color: var(--gilt); font-variant-numeric: tabular-nums; font-size: 0.8rem; font-weight: 600; flex: none; }
.empty { padding: 30px 0; color: var(--muted); max-width: 60ch; }
.empty strong { color: var(--ink); }
.morebtn { margin: 18px auto 0; display: block; border: 1px solid var(--line); background: var(--surface); padding: 8px 18px; border-radius: 999px; cursor: pointer; color: var(--accent); font-weight: 500; }
.morebtn:hover { border-color: var(--accent); }
footer { color: var(--faint); font-size: 0.78rem; padding-block: 10px 30px; border-top: 1px solid var(--line); }
@media (max-width: 520px) {
  .seg button { padding: 5px 9px; }
  .entry .t { font-size: 1.18rem; }
  .shelves { grid-template-columns: 1fr 1fr; }
  .shelf .sar { font-size: 1.12rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
body { background: var(--bg); color: var(--ink); }
.offline-note { display: block; margin-top: 6px; }
.offline-note i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
.offline-note.ok i { background: var(--accent); }
</style>

<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <p class="ar" lang="ar" dir="rtl">فهرس كتب المكتبة</p>
      <h1>Darul Uloom Library</h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>
</div>

<div class="desk">
  <div class="wrap">
    <form class="searchbox" role="search" id="searchform" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label for="q" class="sr" hidden>Search the catalogue</label>
      <input id="q" type="search" dir="auto" placeholder="ابحث بالعنوان أو المؤلف أو الناشر · Title, author, publisher" aria-label="Search the catalogue" enterkeyhint="search">
      <button type="button" id="clearq" aria-label="Clear search" hidden>×</button>
    </form>
    <div class="controls">
      <div class="seg" role="group" aria-label="Search in" id="scope">
        <button type="button" data-scope="all" aria-pressed="true">All</button>
        <button type="button" data-scope="title" aria-pressed="false">Title</button>
        <button type="button" data-scope="author" aria-pressed="false">Author</button>
        <button type="button" data-scope="publisher" aria-pressed="false">Publisher</button>
      </div>
      <select id="cat" aria-label="Category"></select>
      <select id="lang" aria-label="Language">
        <option value="">Language</option>
        <option value="ar">Arabic</option>
        <option value="ur">Urdu</option>
        <option value="en">English</option>
      </select>
      <button type="button" class="reset" id="reset" hidden>Clear all</button>
    </div>
  </div>
</div>

<main class="wrap" id="main" aria-live="polite"></main>

<div class="wrap">
  <footer id="foot"></footer>
</div>

<script>// Search engine for the library catalogue. Works in browser and node.
(function (root) {
  const DIAC = /[ً-ٰٟـۖ-ۭ]/g;
  const AR_FOLD = [
    [/[أإآٱ]/g, 'ا'], [/[ىیےئ]/g, 'ي'], [/[ةۃ]/g, 'ه'], [/[ھہ]/g, 'ه'], [/[کگ]/g, 'ك'],
    [/ؤ/g, 'و'], [/ء/g, ''], [/پ/g, 'ب'], [/چ/g, 'ج'], [/ژ/g, 'ز'], [/ٹ/g, 'ت'], [/ڈ/g, 'د'], [/ڑ/g, 'ر'], [/ں/g, 'ن'],
  ];

  // Spelling-insensitive text: folds Arabic/Urdu letter variants, removes harakat and the article ال.
  function norm(s) {
    if (!s) return '';
    s = s.normalize('NFKC').replace(DIAC, '').replace(/[ؤء]و/g, 'و');
    for (const [a, b] of AR_FOLD) s = s.replace(a, b);
    s = s.replace(/(\S{2,})وه(?=\s|$)/g, '$1اه');   // Urdu-style صلوة/زكوة/مشكوة = صلاة/زكاة/مشكاة
    s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/[ʿʾ’‘'`]/g, '');
    s = s.replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    return s.split(' ').map(w => (w.length > 3 && w.startsWith('ال')) ? w.slice(2) : (w.length > 4 && w.startsWith('وال')) ? w.slice(3) : w).join(' ');
  }

  // ---- consonant skeletons: let "Hidayah" find الهداية and tolerate spelling slips ----
  const AR_CLASS = {
    'ب': 'b', 'پ': 'b', 'ت': 't', 'ط': 't', 'ٹ': 't', 'ث': 's', 'س': 's', 'ص': 's', 'ج': 'j', 'چ': 'j',
    'ح': 'h', 'ه': 'h', 'ھ': 'h', 'ہ': 'h', 'خ': 'x', 'د': 'd', 'ض': 'd', 'ڈ': 'd', 'ذ': 'z', 'ز': 'z', 'ظ': 'z', 'ژ': 'z',
    'ر': 'r', 'ڑ': 'r', 'ش': 'c', 'غ': 'g', 'ف': 'f', 'ق': 'k', 'ك': 'k', 'ک': 'k', 'گ': 'k', 'ل': 'l', 'م': 'm', 'ن': 'n', 'ں': 'n',
  };
  const ARTICLES = new Set(['al', 'el', 'ul', 'il', 'an', 'ar', 'as', 'ash', 'at', 'ad', 'adh', 'az', 'ath', 'ud', 'ur', 'us', 'ut', 'un', 'ush', 'uz', 'ad', 'wal', 'wa', 'the', 'of', 'and', 'a']);

  function collapse(s) { return s.replace(/(.)\1+/g, '$1'); }

  const AR_VOWEL = { 'ا': 'a', 'آ': 'a', 'أ': 'a', 'إ': 'a', 'ٱ': 'a', 'و': 'u', 'ي': 'i', 'ى': 'i', 'ی': 'i', 'ے': 'i' };

  // Arabic/Urdu word -> [{s: consonant skeleton, v: skeleton with long vowels}]
  function arWord(w) {
    w = w.normalize('NFKC').replace(DIAC, '');
    if (w.length > 3 && w.startsWith('ال')) w = w.slice(2);
    else if (w.length > 4 && w.startsWith('وال')) w = w.slice(3);
    // a final ة is silent ("Hidaya") or read as t ("Mishkat al-Masabih", "Hidayat"); keep both readings
    const taMarbuta = w.length > 2 && /[ةۃ]$/.test(w);
    if (w.length > 2) w = w.replace(/[ةۃه]$/, '');
    let s = '', v = '';
    for (const ch of w) {
      const c = AR_CLASS[ch];
      if (c) { s += c; v += c; } else if (AR_VOWEL[ch]) v += AR_VOWEL[ch];
    }
    s = collapse(s);
    if (!s) return [];
    const out = [{ s, v: collapse(v) }];
    if (taMarbuta) out.push({ s: collapse(s + 't'), v: collapse(v + 't') });
    return out;
  }

  // Latin transliteration -> one or more readings
  function latWord(w) {
    w = w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
    if (!w || ARTICLES.has(w)) return [];
    const forms = [w];
    const m = w.match(/^(.{3,}?)(ul|il|al|us|ush|ut|ud|ur|un|uz|ut)$/);
    if (m && w.length >= 5) forms.push(m[1]);           // "Fathul" -> "Fath", "Maariful" -> "Maarif"
    const out = [], seen = new Set();
    for (const f0 of forms) {
      const hs = /[aeiou]h$/.test(f0) ? [f0.slice(0, -1), f0] : [f0];   // "-ah" may be ة or ح
      for (const f of hs) {
        let bases = [f.replace(/sh/g, 'C').replace(/kh/g, 'X').replace(/gh/g, 'G').replace(/ch/g, 'J').replace(/zh/g, 'Z').replace(/ph/g, 'F')];
        // "th"/"dh" can be ث/ذ (Uthmani) or Urdu aspirates ته/ده (Thanawi, Kandhlawi)
        if (bases[0].includes('th')) bases = bases.flatMap(b => [b.replace(/th/g, 'S'), b.replace(/th/g, 'TH')]);
        if (bases[0].includes('dh')) bases = bases.flatMap(b => [b.replace(/dh/g, 'Z'), b.replace(/dh/g, 'DH')]);
        for (let v of bases) {
          v = v.replace(/q/g, 'k').replace(/c/g, 'k').replace(/g/g, 'k').replace(/p/g, 'b').replace(/x/g, 'ks').replace(/v/g, 'w');
          const vow = collapse(v.replace(/e/g, 'a').replace(/y/g, 'i').replace(/[ow]/g, 'u').toLowerCase().replace(/[^a-z]/g, ''));
          const sk = collapse(v.replace(/[aeiouwy]/g, '').toLowerCase().replace(/[^a-z]/g, ''));
          if (sk && !seen.has(sk + '|' + vow)) { seen.add(sk + '|' + vow); out.push({ s: sk, v: vow }); }
        }
      }
    }
    return out;
  }

  const isAr = s => /[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]/.test(s);

  function skelWords(text) {
    if (!text) return [];
    const words = text.normalize('NFKC').split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    const out = [];
    for (const w of words) {
      const alts = isAr(w) ? arWord(w) : latWord(w);
      if (alts.length) out.push(alts);
    }
    return out;
  }

  function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max) return max + 1;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i]; let rowMin = i;
      for (let j = 1; j <= b.length; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > max) return max + 1;
      prev = cur;
    }
    return prev[b.length];
  }

  const thr = n => n <= 3 ? 0 : n <= 5 ? 1 : 2;
  const vdist = (a, b) => lev(a, b, 99) / Math.max(a.length, b.length, 1);

  // best distance of one query word (alternatives) against a record's words
  function wordDist(qAlts, recWords, vw) {
    let best = 99;
    for (const q of qAlts) {
      const t = thr(q.s.length);
      for (let i = 0; i < recWords.length; i++) {
        for (const r of recWords[i]) {
          let d = r.s === q.s ? 0 : (q.s.length >= 4 && r.s.startsWith(q.s)) ? 0.5 : lev(q.s, r.s, t);
          if (d <= t) best = Math.min(best, d + vw * vdist(q.v, r.v));
          if (i + 1 < recWords.length && q.s.length >= 5) {
            for (const r2 of recWords[i + 1]) {
              const d2 = lev(q.s, collapse(r.s + r2.s), t);
              if (d2 <= t) best = Math.min(best, d2 + 0.3 + vw * vdist(q.v, r.v + r2.v));
            }
          }
        }
      }
    }
    return best;
  }

  const FIELDS = { all: ['t', 'a', 'm', 'p'], title: ['t'], author: ['a', 'm'], publisher: ['p'] };
  const WEIGHT = { t: 1, a: 0.8, m: 0.6, p: 0.4, o: 0.4 };

  function buildIndex(books) {
    for (const b of books) {
      b._n = {}; b._s = {};
      for (const f of ['t', 'a', 'm', 'p']) {
        b._n[f] = norm(b[f] || '');
        b._s[f] = skelWords(b[f] || '');
      }
      b._sortKey = b._n.t;
    }
    return books;
  }

  // Returns {exact:[{b,score}], close:[{b,score}]}
  function search(books, query, scope) {
    const fields = FIELDS[scope] || FIELDS.all;
    const nq = norm(query);
    const tokens = nq.split(' ').filter(Boolean);
    const qSkel = skelWords(query);
    const vw = isAr(query) ? 1.5 : 0.6;  // Arabic script writes long vowels, so vowel differences count more
    const exact = [], close = [];

    for (const b of books) {
      // exact (spelling-folded) match: every token found in the chosen fields
      let ok = true, score = 0;
      for (const tok of tokens) {
        let best = 0;
        for (const f of fields) {
          const txt = b._n[f];
          if (!txt) continue;
          const idx = (' ' + txt + ' ').indexOf(' ' + tok);
          if (idx >= 0) best = Math.max(best, WEIGHT[f] * ((' ' + txt + ' ').indexOf(' ' + tok + ' ') >= 0 ? 1.2 : 1));
          else if (txt.includes(tok)) best = Math.max(best, WEIGHT[f] * 0.7);
        }
        if (!best) { ok = false; break; }
        score += best;
      }
      if (ok) {
        for (const f of fields) {
          if (b._n[f] === nq) score += 3 * WEIGHT[f];
          else if (b._n[f].startsWith(nq)) score += 1.5 * WEIGHT[f];
        }
        exact.push({ b, score });
        continue;
      }
      // close match on consonant skeletons
      if (!qSkel.length || qSkel.reduce((n, a) => n + Math.max(...a.map(x => x.s.length)), 0) < 2) continue;

      for (const f of fields) {

        if (!rw.length) continue;
        let total = 0;
        for (const qa of qSkel) {
          const d = wordDist(qa, rw, vw);
          if (d > 3) { total = 99; break; }
          total += d;
        }
        if (total < 99) bestF = Math.min(bestF, total + (1 - WEIGHT[f]));
      }
      if (bestF < 99) close.push({ b, score: bestF });
    }

f divine decree and predestination in a unique style and this poem was written in response to another poem made in the time of Shaykh al-Islam Taqi Al-Deen Ibn DaqĪq Al-ʿĪd (d. 702 AH). This poem comprises of 195 verses, for which the author provides a comprehensive commentary, solving its complexities and opening up its ambiguities. The author also sheds light on the views of various Islamic sects, including the Qadariyyah, Muʿtazilites, Jabariyyah, and Ahl al-Sunnah wa al-Jamaʿah, mentioning their positions on divine decree, predestination, and the actions of the slave.\nThe author translated and included two important discussions related to the subject of the two treatises in this book, taken from the author’s book عقائد إسلام .These discussions summarize the author’s views on the topic.","k":[9],"l":"ar","s":["عقيدة!77"]},{"t":"اللامذهبية اخطر بدعة تهدد الشريعة الاسلامية","a":"محمد سعيد رمضان البوطي","p":"دار الفكر","c":1,"e":"1","k":[9],"l":"ar","s":["عقيدة!78"]},{"t":"اللامذهبية قنطرة اللا دينية","a":"العلامة محمد زاهد الكوثري","p":"المكتبة الأزهرية للتراث","c":1,"k":[9],"l":"ar","s":["عقيدة!79"]},{"t":"اللمعة","a":"ابراهيم بن مصطفى الحلبي","p":"المكتبة الأزهرية للتراث","c":1,"k":[9],"l":"ar","s":["عقيدة!80"]},{"t":"المختصر المفيد","a":"نوح علي سليمان القضاة","p":"دار الرازي","c":1,"k":[9],"l":"ar","s":["عقيدة!81"]},{"t":"المذاهب التوحيدية","a":"محمد سعيد رمضان البوطي","p":"دار الفكر","c":1,"k":[9],"l":"ar","s":["عقيدة!82"]},{"t":"المسلك المنصورد","a":"مولانا محمد سرفراز خان صفدر","p":"مكتبة صفدرية","c":1,"k":[9],"l":"ar","s":["عقيدة!83"]},{"t":"المعتمد من المعتقد","a":"الامام علاء الدين ابي بكر بن مسعود بن احمد الكساني","p":"دار النور المبين للنشر والتوزيع","c":1,"k":[9],"l":"ar","s":["عقيدة!84"]},{"t":"المقدمات الخمس و العشرون","a":"ابي عمران موسى بن ميمون","p":"المكتبة الأزهرية للتراث","c":1,"k":[9],"l":"ar","s":["عقيدة!85"]},{"t":"المقصد الاسني في شرح معاني اسماء الله الحسني","a":"الامام ابو محامد الغزالي","p":"دار السلام","c":1,"e":"1","k":[9],"l":"ar","s  several Ijtihādāts of Sheikh Muhammad Shafee’ Uthmani رحمه الله in Fiqh al-Nawazil, by comparing his opinions and Ijtihādāts with those provided earlier by other scholars. The study also discusses a number of issues related to various topics. From amongst them are: Giving the Friday sermon in the Arabic language, Organ transplantation, Population control, The national assembly, and Copyright laws.\n\nAmong the conclusions reached by the researcher is that there are several factors that distinguish Sheikh Muhammad Shafee’ Uthmani’s رحمه الله methadology in addressing new issues:\n\n1. *A Comprehensive approach*: As he gathers all relevant Qur’anic Āyaat and Ahādeeth related to the issue being studied.\n\n2. *His Interpretation of the Quranic verses & determination of their meanings*: By relying on the books of Tafāseer and Ahādeeth to comprehend the Religious Texts in a correct manner.\n\n\n3. *Seeking advice from the specialists*: By trying to get the opinions of the experts and specialists in fields related to the issue at hand.\n\n4. *Consultation among scholars of Sharia’*: And that is by engaging in discussions and exchanging opinions with other scholars to arrive at an accurate legal ruling.\n\n\n5. *Presentation of guidelines as a preface*: In some cases, Sheikh Muhammad Shafee’ Uthmani رحمه الله provides rules and principles as an introduction to the discussions around the issue.\n\n6. *Usage of rational evidence*: In addition to Shariee evidence, he at times uses rational evidences to support his conclusions.\nتناول هذا البحث تعريف فقه النوازل و شروط الإجتهاد بالإضافة إلى الضوابط الازمة للوصول إلى الحكم الشرعي في القضايا المستجدة ثم أجرى دراسه تحليلية لنماذج من فتاوى الشيخ في فقه النوازل مقارنا ايها بآراء العلماء المعاصرين\nو قام الباحث بتحليل وتقويم عدة اجتهادات للشيخ عثماني في فقه النوازل من خلال مقارنة آراءه واجتهاداته بتلك التي قدمها علماء آخرون وناقش البحث عدة مسائل تتعلق بموضوعات متنوعة منها خطبة الجمعة باللغة العربية نقل الأعضاء تحديد النسل التجم الوطني و حقوق التأليف و النشر\nمن النتائج التي وصل اليها الباحث عن ما يميز منهج الشيخ العثماني في تناول المسائل المستجدة يتضمن عدة جوانب\n• النظرة الشمولية: حيث يجمع كل الآيات والأحاديث النبوية المتعلقة بالمسألة موضوع البحث\n• تفسير الآيات وتحديد مرادها: بالإستعانة بكتب التفسير والأحاديث لفهم النصوص الشرعية بشكل صحيح\n• الإستشارة من اهل التخصيص: حيث يسعى للحصول علي رأي الخبراء والمختصين في المجلات المتربطة بالمسألة\n• التشاور بين علماء الشريعة: وذلك من خلال النقاش وتبادل الآراء مع العلماء الآخرين للوصول إلى حكم شرعي دقيق\n• ذكر الضوابط كمقدمة: في بعض الأحيان يقدم الشيخ ضوابط وقواعد كتمهيد للنقاش حول المسألة\n• الإستدلال بالإدلة العقلية: بالإضافة إلى الأدلة الشرعية يستخدم أحيانا الأدلة العقلية لدعم استنتاجاته","k":[11],"l":"ar","s":["تاريخ وتراجم!59"]},{"t":"الموسوعة الميسرة في التاريخ الاسلامي","a":"فريق البحوث و الدراسان الاسلامية","p":"مؤسسة اقرأ","v":"2","c":1,"k":[11],"l":"ar","s":["تاريخ وتراجم!60"]},{"t":"المؤلفون في السنة و السيرة النبوية","a":"عبد الملك بن بكر بن عبد الله قاضي","p":"مبرة بكر عبد الله قاضي الحديثية","v":"10","c":1,"k":[11],"l":"ar","s":["تاريخ وتراجم!61"]},{"t":"الى الاسلام من جديد","a":"الشيخ أبو الحسن علي الحسني الندوي","p":"دار ابن كثير","v":"1","c":1,"k":[11],"l":"ar","s":["تاريخ وتراجم!62"]},{"t":"ام المؤمنين زينب","a":"امينة عمر الخراط","p":"دار القلم","c":1,"e":"1","k":[11],"l":"ar","s":["تاريخ وتراجم!63"]},{"t":"امام اعظم ابو حنيفة","a":"مولانا محمد فياض خان سواتي","p":"ادارة نشر و اشاعت مدرسة نصرة العلوم كو جر انوال","c":1,"k":[11],"l":"ar","s":["تاريخ وتراجم!64"]},{"t":"امام العصر علامہ كشميري اور جامعہ اسلاميہ ڈابھيل","a":"مفتي عبد القيوم راجكوٹی","p":"دفتر اہتمام جامعہ اسلاميہ ڈاهبيل","v":"1","c":1,"k":[11],"l":"ur","s":["تاريخ وتراجم!65"]},{"t":"امام محمد بن حسن الشيباني اور ان كی فقہی خدمات","a":"داکٹر محمد الدسوقی","p":"اداره تحقيقات اسلامی","v":"1","c":1,"k":[11],"l":"ur","s":["تاريخ وتراجم!66"]},{"t":"اولياء ملتان","a":"مولانا محمد ناصر الدين خاكواني","p":"إدارة تأليفات أشرفية","c":1,"k":[11],"l":"ar","s":["تاريخ وتراجم!67"]},{" īth.\n- Mentioning rulings pertaining to Arabic Grammar and Morphology, which are, at times, obscure in their primary sources.\n- Deriving shar'ī rulings for some modern-day Masaail from the Ahādīth directly.\n- Detailed commentary on every Tarjamatul Baab (the chapters of the book), while occasionally presenting the correlation between certain chapters.","k":[4],"l":"ar","s":["شروحات الحديث!52"]},{"t":"حدائق الصالحين","a":"مولانا محمد اسلم زاهد","p":"مكتبة خليل","c":1,"e":"1","k":[4],"l":"ar","s":["شروحات الحديث!53"]},{"t":"حديث مسلسل بلأوليت","a":"مفتي محمد رفيع العثماني","p":"إدارة المعارف كراتشي","c":1,"e":"1","n":["NO"],"k":[4],"l":"ar","s":["شروحات الحديث!54"]},{"t":"حسن المعبود في حل سنن ابي داود","a":"مولانا صوفي محمد سرور","p":"جامة عبد الله ابن عمر","c":1,"k":[4],"l":"ar","s":["شروحات الحديث!55"]},{"t":"خزائن السنن","a":"مولانل محمد سرفراز خان","m":"مولانا رشيد الحق خان","p":"مكتبة صفدرية","v":"2","c":1,"e":"1","k":[4],"l":"ar","s":["شروحات الحديث!56"]},{"t":"خير المفاتيح","a":"علامة شبير الحق كشميري","p":"إدارة تأليفات أشرفية","v":"6","c":1,"e":"1","k":[4],"l":"ar","s":["شروحات الحديث!57"]},{"t":"درس ابو داود شريف","a":"مفتي موسي بدات بلشولي","p":"النصيح ببلكيشن","v":"2","c":1,"k":[4],"l":"ur","s":["شروحات الحديث!58"]},{"t":"درس بخاري","a":"علامة شبير احمد العثماني","m":"مولانا حبيب الرحمن الأعظمي","p":"ايج ايم سعيد كمبني","v":"2","c":1,"k":[4],"l":"ar","s":["شروحات الحديث!59"]},{"t":"درس ترمذي","a":"مفتي محمد تقي العثماني","p":"مكتبة دار العلوم كراتشي","v":"3","c":1,"k":[4],"l":"ar","s":["شروحات الحديث!60"]},{"t":"درس ترمذي","a":"مفتي محمد تقي العثماني","p":"كتب خانه نعيمية","v":"3","c":1,"k":[4],"l":"ar","s":["شروحات الحديث!61"]},{"t":"درس مسلم","a":"مفتي محمد تقي العثماني","m":"مولانا اعجاز احمد صمداني/مولانا طاهر اقبال","p":"إدارة المعارف كراتشي","v":"2","c":2,"k":[4],"l":"ar","s":["شروحات الحديث!62","شروحات الحديث!63"]},{"t":"درس مسلم","a":"مفتي محمد تقي العثماني","m":"مولانا اعجاز احمد صمداني/مولانا طاهر اقبال","p":"إدارة المعارف كراتشي","v":"2","c" ,"p":"مجلس نشریات اسلام"},{"t":"تحفة العلماء","v":"1","c":1,"n":["Not in the spreadsheet; added 12 Oct 2026 from a shelf photo (Case F, level 3). Red leather binding."],"k":[11],"l":"ar","s":["extra!65"],"a":"أحمد أيوب"},{"t":"عقود الجمان في مناقب الإمام الأعظم أبي حنيفة النعمان","v":"1","c":1,"n":["Not in the spreadsheet; added 12 Oct 2026 from a shelf photo (Case F, level 3)."],"k":[11],"l":"ar","s":["extra!66"],"a":"الحافظ محمد بن يوسف الصالحي (تحقيق أبي الوفاء محمود شاه الأفغاني)"},{"t":"قصة التتار من البداية إلى عين جالوت","v":"1","c":1,"n":["Not in the spreadsheet; added 12 Oct 2026 from a shelf photo (Case F, level 4)."],"k":[11],"l":"ar","s":["extra!67"],"a":"د. راغب السرجاني","p":"مؤسسة اقرأ"},{"t":"ماہنامہ نصرۃ العلوم — مفسر قرآن نمبر","v":"1","c":1,"n":["Not in the spreadsheet; added 12 Oct 2026 from a shelf photo (Case F, level 4). Special issue of the monthly نصرۃ العلوم."],"k":[11],"l":"ur","s":["extra!68"],"p":"ادارہ نشر و اشاعت جامعہ نصرۃ العلوم، گوجرانوالہ"},{"t":"البلاغ — عارفی نمبر","v":"1","c":1,"n":["Not in the spreadsheet; added 12 Oct 2026 from a shelf photo (Case F, level 4). Special issue of the monthly البلاغ on Dr ʿAbd al-Ḥayy ʿĀrifī."],"k":[11],"l":"ur","s":["extra!69"],"p":"دار العلوم کراچی"}]}</script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CATS = DATA.cats, BOOKS = LibSearch.buildIndex(DATA.books);
  const COLLECTIONS = new Set([8, 20]); // Ḥanafī uṣūl (iftā class) and Shaykh ʿAbd al-Fattāḥ: lists that overlap subject shelves
  const PAGE = 60;
  const $ = s => document.querySelector(s);
  const q = $('#q'), main = $('#main');
  const state = { q: '', scope: 'all', cat: '', lang: '', limit: PAGE };

  const fmt = n => n.toLocaleString('en-GB');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const isAr = s => /[؀-ۿﭐ-﷿ﹰ-﻿]/.test(s || '');

  // counts
  const catCount = CATS.map(() => 0);
  let copies = 0;
  for (const b of BOOKS) { for (const k of b.k) catCount[k]++; copies += b.c || 1; }
  $('#stats').innerHTML = `<span><b>${fmt(BOOKS.length)}</b> titles</span><span><b>${fmt(copies)}</b> copies</span><span><b>${CATS.length}</b> categories</span>`;
  $('#foot').innerHTML = `Catalogue built from the library spreadsheet on 3 October 2026. Each entry shows the sheet and row it came from, so corrections can be made in the spreadsheet.`;

  const catSel = $('#cat');
  catSel.innerHTML = '<option value="">All categories</option>' + CATS.map((c, i) => `<option value="${i}">${esc(c.en)} · ${esc(c.ar)} (${catCount[i]})</option>`).join('');

  // highlight: mark query tokens in a display string (spelling-folded comparison per word)
  function highlight(text, tokens) {
    if (!tokens.length || !text) return esc(text);
    return text.split(/(\s+)/).map(w => {
      if (/^\s+$/.test(w)) return w;
      const nw = LibSearch.norm(w);
      return nw && tokens.some(t => t.length > 1 && nw.includes(t)) ? `<mark>${esc(w)}</mark>` : esc(w);
    }).join('');
  }

  function spines(v) {
    const n = parseInt(v, 10);
    if (!n || n < 2) return '';
    const shown = Math.min(n, 12);
    let h = '';
    for (let i = 0; i < shown; i++) h += `<i style="height:${8 + ((i * 7) % 5)}px"></i>`;
    return `<span class="spines" aria-hidden="true">${h}</span>`;
  }

  function entryHTML(b, tokens) {
    const ar = isAr(b.t);
    const dir = ar ? 'rtl' : 'ltr';
    const parts = [];
    parts.push(`<h3 class="t" dir="auto">${highlight(b.t, tokens)}</h3>`);
    if (b.a) parts.push(`<div class="by" dir="auto"><button class="linkish" data-author="${esc(b.a)}" title="More by this author">${highlight(b.a, tokens)}</button></div>`);
    if (b.m) parts.push(`<div class="by" dir="auto"><span class="role">${ar ? 'تحقيق' : 'Edited by'}</span> <button class="linkish" data-author="${esc(b.m)}" title="More by this muhaqqiq">${highlight(b.m, tokens)}</button></div>`);
    if (b.p) parts.push(`<div class="pub" dir="auto">${highlight(b.p, tokens)}</div>`);
    const chips = [];
    for (const k of b.k) chips.push(`<button class="chip cat" data-cat="${k}" title="Show this category"><bdi>${esc(CATS[k].en)}</bdi></button>`);
    if (b.v) {
      const n = parseInt(b.v, 10);
      const label = /^\d+$/.test(b.v) ? (n === 1 ? '1 vol' : `${n} vols`) : `${b.v} vols`;
      chips.push(`<span class="chip gold">${spines(b.v)}<bdi>${esc(label)}</bdi></span>`);
    }
    if ((b.c || 1) > 1) chips.push(`<span class="chip gold"><bdi>${b.c} copies</bdi></span>`);
    if (b.e) chips.push(`<span class="chip"><bdi>Edition ${esc(b.e)}</bdi></span>`);
    if (b.l === 'en') chips.push(`<span class="chip"><bdi>English</bdi></span>`);
    if (b.l === 'ur') chips.push(`<span class="chip"><bdi>Urdu</bdi></span>`);
    parts.push(`<div class="meta">${chips.join('')}</div>`);
    if (b.n && b.n.length) parts.push(`<div class="notes" dir="auto">${b.n.map(esc).join(' · ')}</div>`);
    const src = (b.s || []).map(s => { const [sh, row] = s.split('!'); return sh === 'extra' ? 'Added from a shelf photo (not in the spreadsheet)' : `${esc(sh)}, row ${row}`; }).join('; ');
    parts.push(`<details class="more"><summary>${b.d ? 'Description and spreadsheet row' : 'Spreadsheet row'}</summary>${b.d ? `<p dir="auto">${esc(b.d)}</p>` : ''}<div class="src" dir="ltr">Sheet: <bdi>${src}</bdi></div></details>`);
    return `<li class="entry" dir="${dir}">${parts.join('')}</li>`;
  }

  function filtered(list) {
    return list.filter(x => {
      const b = x.b || x;
      if (state.cat !== '' && !b.k.includes(+state.cat)) return false;
      if (state.lang && b.l !== state.lang) return false;
      return true;
    });
  }

  const PH = { all: 'ابحث بالعنوان أو المؤلف أو الناشر · Title, author, publisher', title: 'ابحث بالعنوان · Search titles', author: 'ابحث باسم المؤلف · Search authors', publisher: 'ابحث باسم الناشر · Search publishers' };
  const SCOPE_LABEL = { all: 'Results for', title: 'Titles matching', author: 'Authors matching', publisher: 'Publishers matching' };
  function nameList(kind) {
    const counts = new Map();
    for (const b of filtered(BOOKS)) {
      const parts = kind === 'author' ? [...new Set([...(b.a || '').split(' / '), ...(b.m || '').split(' / ')].map(s => s.trim()))] : [b.p || ''];
      for (let p of parts) {
        p = p.trim(); if (!p) continue;
        const k = LibSearch.norm(p);
        if (!counts.has(k)) counts.set(k, { n: 0, names: new Map() });
        const e = counts.get(k); e.n++; e.names.set(p, (e.names.get(p) || 0) + 1);
      }
    }
    return [...counts.values()].map(e => ({ name: [...e.names].sort((x, y) => y[1] - x[1])[0][0], n: e.n }))
      .sort((x, y) => y.n - x.n || x.name.localeCompare(y.name, 'ar'));
  }
  const byTitle = (a, b) => a._sortKey.localeCompare(b._sortKey, 'ar');

  function render() {
    const query = state.q.trim();
    const anyFilter = state.cat !== '' || state.lang;
    $('#clearq').hidden = !state.q;
    $('#reset').hidden = !(query || anyFilter || state.scope !== 'all');
    for (const [el, on] of [[catSel, state.cat !== ''], [$('#lang'), !!state.lang]]) el.classList.toggle('on', on);

    q.placeholder = PH[state.scope];
    if (!query && (state.scope === 'author' || state.scope === 'publisher')) {
      const list = nameList(state.scope);
      const shown = list.slice(0, state.limit * 2);
      const what = state.scope === 'author' ? 'Authors' : 'Publishers';
      main.innerHTML = `<div class="sectionhead"><h2>${state.scope === 'author' ? 'Authors &amp; editors' : what}${state.cat !== '' ? ' in ' + esc(CATS[+state.cat].en) : ''}, most books first</h2><span class="count">${fmt(list.length)} ${what.toLowerCase()}</span></div>
        <div class="names">${shown.map(x => `<button class="nm" dir="auto" data-pick="${esc(x.name)}"><span class="nn">${esc(x.name)}</span><span class="nc">${x.n}</span></button>`).join('')}</div>
        ${list.length > shown.length ? `<button class="morebtn" id="more">Show more (${fmt(list.length - shown.length)} left)</button>` : ''}
        <p class="hint">Tap a name to see its books, or type in the box above to search ${what.toLowerCase()} only.</p>`;
      return;
    }
    if (!query && !anyFilter) {
      const shelf = i => `<button class="shelf${COLLECTIONS.has(i) ? ' collection' : ''}" data-cat="${i}"><span class="sar" lang="ar">${esc(CATS[i].ar === 'Miscellaneous' ? 'متفرقات' : CATS[i].ar)}</span><span class="sen">${esc(CATS[i].en)}</span><span class="sn">${catCount[i]}</span></button>`;
      const subj = CATS.map((c, i) => i).filter(i => !COLLECTIONS.has(i));
      main.innerHTML = `<div class="sectionhead"><h2>Browse by subject</h2><span class="count">${CATS.length - COLLECTIONS.size} shelves</span></div>
        <div class="shelves">${subj.map(shelf).join('')}</div>
        <div class="sectionhead" style="margin-top:26px"><h2>Special lists</h2><span class="count">books also shelved by subject</span></div>
        <div class="shelves">${[...COLLECTIONS].map(shelf).join('')}</div>
        <p class="hint">Search in the language of the book's title. Small spelling differences are ignored: ي/ى, ة/ه, ك/ک/گ, أ/ا, harakāt, and Urdu spellings like مشكوة for مشكاة all match. A slightly misspelt word (تحفيق for تحقيق) still turns up under “Close matches”. English spellings of Arabic titles work too: <em>fathul bari</em> finds فتح الباري. Press <kbd>/</kbd> to jump to the search box.</p>`;
      return;
    }

    let exact, close = [];
    if (query) {
      const r = LibSearch.search(BOOKS, query, state.scope);
      exact = filtered(r.exact).map(x => x.b);
      close = filtered(r.close).map(x => x.b);
    } else {
      exact = filtered(BOOKS).slice().sort(byTitle);
    }
    const tokens = LibSearch.norm(query).split(' ').filter(Boolean);
    const total = exact.length + close.length;
    const label = query ? `${SCOPE_LABEL[state.scope]} “${esc(query)}”` : (state.cat !== '' ? `${esc(CATS[+state.cat].en)} · <span lang="ar">${esc(CATS[+state.cat].ar)}</span>` : 'Filtered books');

    if (!total) {
      main.innerHTML = `<div class="sectionhead"><h2>${label}</h2></div><div class="empty"><strong>No books found.</strong><br>Try a shorter search (one distinctive word of the title or the author's best-known name), switch the search to “All”, or clear the filters.</div>`;
      return;
    }
    let html = `<div class="sectionhead"><h2>${label}</h2><span class="count">${exact.length ? `${fmt(exact.length)} ${exact.length === 1 ? 'book' : 'books'}${close.length ? ` + ${close.length} close` : ''}` : `${close.length} close ${close.length === 1 ? 'match' : 'matches'}`}</span></div>`;
    let budget = state.limit;
    if (exact.length) {
      html += `<ol class="results">${exact.slice(0, budget).map(b => entryHTML(b, tokens)).join('')}</ol>`;
      budget -= Math.min(exact.length, budget);
    }
    if (close.length && budget > 0) {
      html += `<div class="divider"><h2>${exact.length ? 'Close matches' : 'Close matches'}</h2><p>${exact.length ? 'Similar spellings or English transliterations of what you typed.' : 'Nothing matched exactly, so these are the nearest spellings and transliterations.'}</p></div>`;
      html += `<ol class="results">${close.slice(0, budget).map(b => entryHTML(b, tokens)).join('')}</ol>`;
    }
    if (total > state.limit) html += `<button class="morebtn" id="more">Show more (${fmt(total - state.limit)} left)</button>`;
    main.innerHTML = html;
  }

  let timer;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { state.q = q.value; state.limit = PAGE; render(); }, 120); });
  $('#searchform').addEventListener('submit', e => { e.preventDefault(); state.q = q.value; render(); q.blur(); });
  $('#clearq').addEventListener('click', () => { q.value = ''; state.q = ''; state.limit = PAGE; render(); q.focus(); });
  $('#scope').addEventListener('click', e => {
    const btn = e.target.closest('button[data-scope]'); if (!btn) return;
    state.scope = btn.dataset.scope; state.limit = PAGE;
    for (const b of $('#scope').children) b.setAttribute('aria-pressed', String(b === btn));
    render();
    if (state.scope === 'title' || (state.scope !== 'all' && state.q)) q.focus({ preventScroll: true });
  });
  const setScope = s => { state.scope = s; for (const b of $('#scope').children) b.setAttribute('aria-pressed', String(b.dataset.scope === s)); };
  catSel.addEventListener('change', () => { state.cat = catSel.value; state.limit = PAGE; render(); });
  $('#lang').addEventListener('change', e => { state.lang = e.target.value; state.limit = PAGE; render(); });
  $('#reset').addEventListener('click', () => {
    Object.assign(state, { q: '', scope: 'all', cat: '', lang: '', limit: PAGE });
    q.value = ''; catSel.value = ''; $('#lang').value = ''; setScope('all'); render();
  });
  main.addEventListener('click', e => {
    const cat = e.target.closest('[data-cat]');
    if (cat) { state.cat = cat.dataset.cat; catSel.value = state.cat; state.limit = PAGE; render(); window.scrollTo({ top: 0 }); return; }
    const au = e.target.closest('[data-author]');
    if (au) { q.value = au.dataset.author; state.q = q.value; setScope('author'); state.limit = PAGE; render(); window.scrollTo({ top: 0 }); return; }
    const pick = e.target.closest('[data-pick]');
    if (pick) { q.value = pick.dataset.pick; state.q = q.value; state.limit = PAGE; render(); window.scrollTo({ top: 0 }); return; }
    if (e.target.id === 'more') { state.limit += PAGE * 2; render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  render();
})();
</script>

<script>
// Offline app: save the catalogue on this device and show whether it is ready to use without signal.
(function () {
  var foot = document.getElementById('foot');
  var note = document.createElement('span'); note.className = 'offline-note';
  function say(ok, text) { note.className = 'offline-note' + (ok ? ' ok' : ''); note.innerHTML = '<i></i>' + text; if (!note.parentNode && foot) foot.appendChild(note); }
  if (!('serviceWorker' in navigator)) { say(false, 'This browser can’t save the catalogue for offline use.'); return; }
  var hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
    say(false, 'Saving the catalogue to this device…');
    return navigator.serviceWorker.ready;
  }).then(function () {
    say(true, 'Saved on this device · works without signal' + (navigator.onLine ? '' : ' · you are offline now'));
  }).catch(function () { say(false, 'Couldn’t save for offline use. Open it once more with signal.'); });
  // a newer catalogue was saved in the background: reload once to show it
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !sessionStorage.getItem('du-reloaded')) { try { sessionStorage.setItem('du-reloaded', '1'); } catch (e) {} location.reload(); }
  });
  window.addEventListener('offline', function () { say(true, 'Saved on this device · you are offline now'); });
  window.addEventListener('online', function () { say(true, 'Saved on this device · works without signal'); });
})();
</script>
